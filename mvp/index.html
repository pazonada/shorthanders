// Read-only invoice viewer, shared across the reporter's Payments + Invoices lists and the firm's
// Invoices list, so clicking any invoice or payment opens the SAME thing – a modal, not its own
// page (the back button was unreliable). Prints as a standalone page/receipt via window.print().
// Drafts never open here; they open the builder to edit (see the state model in launch_prep).
function InvoiceModal({ inv, viewer, onClose }) {
  const store = useStore();
  const meMeta = useMemo(() => buildDirectory().find((x) => x.id === store.myCsr), [store.myCsr]);
  const [copied, setCopied] = useState(false);
  const [tplSaved, setTplSaved] = useState(false);
  const paid = inv.status === "paid";
  // Reporter viewing their own invoice -> full identity; firm viewing -> the reporter name the
  // invoice carries (inv.from).
  const reporterName = viewer === "reporter" ? (meMeta ? meMeta.name : inv.from) : (inv.from || "Court reporter");
  const reporterSub = viewer === "reporter" && meMeta
    ? "Certified Shorthand Reporter · CSR #" + meMeta.csrNumber + (meMeta.city ? " · " + meMeta.city + ", CA" : "")
    : "Certified Shorthand Reporter";
  const items = inv.lineItems && inv.lineItems.length ? inv.lineItems : [{ desc: inv.desc, flat: true, amount: inv.amount }];
  const payLink = inv.payLink || ("https://pay.deweysholes.com/i/" + inv.id.toLowerCase());
  const copy = () => { navigator.clipboard.writeText(payLink); setCopied(true); setTimeout(() => setCopied(false), 1800); };
  // Save this invoice's line structure as a reusable template. Only the line labels + their
  // metered/flat kind carry over - not the firm, matter, dates, or amounts (those are per-invoice).
  const saveAsTemplate = () => {
    const name = (window.prompt && window.prompt("Name this template. Only the line labels are saved, not the firm or the amounts.", "My invoice layout")) || null;
    if (name) { store.addTemplate({ id: "custom", name, lines: items.map((li) => ({ desc: li.desc, kind: li.flat ? "flat" : "unit", qty: "1", rate: "" })) }); setTplSaved(true); }
  };
  const payNow = () => { store.updateInvoice(inv.id, { status: "paid", method: "Card", paidAt: "2026-07-17" }); onClose(); };

  return (
    <div className="modal-overlay invoice-modal-overlay" onClick={onClose}>
      <div className="ds-card invoice-print" style={{ maxWidth: 640, width: "94%", maxHeight: "90vh", overflowY: "auto", padding: 0 }} onClick={(e) => e.stopPropagation()}>
        <div className="no-print" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 18px", borderBottom: "1px solid var(--rule)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontWeight: 700, color: "var(--ink)" }}>{inv.id}</span><InvStatus status={inv.status} viewer={viewer} /></div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <button className="btn btn-secondary" style={{ padding: "6px 12px" }} onClick={() => window.print()}><Icon name="printer" size={15} /> Print</button>
            <button onClick={onClose} title="Close" style={{ background: "none", border: "none", cursor: "pointer", color: "var(--dim)", padding: 4 }}><Icon name="x" size={20} /></button>
          </div>
        </div>
        <div style={{ padding: 18 }}>
          <InvoiceDocument reporterName={reporterName} reporterSub={reporterSub} invoiceId={inv.id} client={inv.client} matter={inv.matter} date={inv.date} due={inv.due} items={items} total={inv.amount} paid={paid} method={inv.method} paidAt={inv.paidAt} />
          <div className="no-print" style={{ marginTop: 16 }}>
            {viewer === "reporter" && !paid ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div className="banner banner-ok"><Icon name="mail" size={18} style={{ flexShrink: 0 }} /><div>Sent to {inv.client}. They can pay by card or ACH from the link below. If new to Dewey Sholes, the email invites them to create a free account to view and pay, which saves you to their firm.</div></div>
                <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                  <div className="ds-panel" style={{ flex: 1, minWidth: 220, padding: "12px 14px", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "var(--ink-soft)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{payLink}</div>
                  <button className="btn btn-secondary" onClick={copy}><Icon name="link" size={16} /> {copied ? "Copied!" : "Copy link"}</button>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "var(--muted)", borderTop: "1px solid var(--rule)", paddingTop: 12 }}>
                  <span>Bill work like this often?</span>
                  <button type="button" onClick={saveAsTemplate} disabled={tplSaved} style={{ background: "none", border: "none", color: tplSaved ? "var(--muted)" : "var(--brand-dark)", cursor: tplSaved ? "default" : "pointer", fontWeight: 600, fontSize: 13, display: "inline-flex", alignItems: "center", gap: 5, padding: 0 }}><Icon name={tplSaved ? "check" : "star"} size={14} /> {tplSaved ? "Template saved" : "Save as new template"}</button>
                </div>
              </div>
            ) : viewer === "firm" && !paid ? (
              <div style={{ display: "flex", justifyContent: "flex-end" }}>
                <button className="btn btn-primary" onClick={payNow}><Icon name="dollar" size={16} /> Pay now</button>
              </div>
            ) : (
              <div className="ds-note" style={{ marginBottom: 0 }}><Icon name="printer" size={15} style={{ flexShrink: 0, color: "var(--dim)" }} /><span>Use Print to save a copy of this receipt for your records.</span></div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const backLink = { background: "none", border: "none", color: "var(--muted)", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6, fontSize: 14, marginBottom: 18 };
// ═══ Messaging (text + pass-through secure links; no file storage) ══
// Normalize + lightly validate a pasted link: add https:// if the scheme is missing, and require a
// host with a dot so random text ("hello") can't pass as a URL. Returns the clean URL, or null.
function normalizeUrl(raw) {
  let s = (raw || "").trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try {
    const u = new URL(s);
    if (!u.hostname.includes(".")) return null;
    return u.href;
  } catch (e) { return null; }
}
function MessagesPanel({ embedded }) {
  const store = useStore();
  const convos = store.convos;
  const dir = useMemo(() => buildDirectory(), []);   // build once, not on every render/keystroke
  const [activeId, setActiveId] = useState(convos[0] ? convos[0].id : null);
  const active = convos.find((c) => c.id === activeId);
  // The reporter this conversation is with, so a firm sees the "not accepting new work" reminder.
  const withRep = active ? dir.find((x) => x.name === active.with) : null;
  const [draft, setDraft] = useState("");
  const [reqOpen, setReqOpen] = useState(false);
  const sendRequest = (req) => {
    store.requestInvoice({ reporterName: active.with, firmName: store.firmName, matter: req.matter, desc: req.desc, amount: req.amount, at: "Just now" });
    const line = "Requested an invoice" + (req.matter ? " for " + req.matter : "") + (req.desc ? " – " + req.desc : "") + (req.amount ? " (about $" + req.amount.toLocaleString() + ")" : "") + ". Please send it here so I can pay by card or ACH.";
    store.pushMessage(active.id, { from: "me", t: line, at: "Just now" });
    setReqOpen(false);
  };
  const [linkOpen, setLinkOpen] = useState(false);
  const [linkUrl, setLinkUrl] = useState("");
  const [linkLabel, setLinkLabel] = useState("");
  const [attachedLink, setAttachedLink] = useState(null);   // committed { url, label }, shown as a chip
  const [linkError, setLinkError] = useState("");
  const threadRef = useRef(null);
  // Pin the thread to its latest message by scrolling the thread's OWN container – not
  // scrollIntoView, which also scrolls the whole window down and buries the page header.
  useEffect(() => { const el = threadRef.current; if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; }); }, [activeId, active && active.msgs.length]);

  // Commit the typed URL into an attached-link "chip" (validated), so the sender can SEE it's
  // attached before sending - instead of guessing whether it will ride along with Send.
  const attachLink = () => {
    const url = normalizeUrl(linkUrl);
    if (!url) { setLinkError("Enter a valid link, like https://your-file-host.com/…"); return; }
    setAttachedLink({ url: url, label: linkLabel.trim() || "Shared link" });
    setLinkUrl(""); setLinkLabel(""); setLinkError(""); setLinkOpen(false);
  };

  const send = () => {
    let link = attachedLink;
    // If the user typed a link but didn't click "Attach", fold it in on Send (validated) rather than
    // silently dropping it - so either flow works and a bad URL is caught, not sent as-is.
    if (!link && linkUrl.trim()) {
      const url = normalizeUrl(linkUrl);
      if (!url) { setLinkError("Enter a valid link, like https://your-file-host.com/…"); return; }
      link = { url: url, label: linkLabel.trim() || "Shared link" };
    }
    if (!draft.trim() && !link) return;
    const msg = { from: "me", t: draft.trim(), at: "Just now" };
    if (link) msg.link = link;
    store.pushMessage(activeId, msg);
    setDraft(""); setAttachedLink(null); setLinkUrl(""); setLinkLabel(""); setLinkError(""); setLinkOpen(false);
  };

  const meLabel = store.role === "firm" ? "you (firm)" : "you";

  return (
    <div style={{ display: "grid", gridTemplateColumns: "280px 1fr", gridTemplateRows: "minmax(0, 1fr)", gap: 0, border: "1px solid var(--rule)", borderRadius: 18, overflow: "hidden", height: embedded ? 560 : 640, background: "var(--bg)" }} className="msg-grid">
      {/* conversation list */}
      <div style={{ borderRight: "1px solid var(--rule)", overflowY: "auto", background: "var(--bg-soft)" }}>
        <div style={{ padding: "16px 18px", borderBottom: "1px solid var(--rule)", fontWeight: 700, fontSize: 15 }}>Messages</div>
        {convos.map((c) => (
          <button key={c.id} onClick={() => { setActiveId(c.id); store.markRead(c.id); }} style={{ width: "100%", textAlign: "left", background: c.id === activeId ? "var(--bg)" : "none", border: "none", borderBottom: "1px solid var(--rule)", padding: "14px 18px", cursor: "pointer", display: "flex", gap: 12, alignItems: "center" }}>
            <Avatar name={c.with} size={40} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontWeight: 600, fontSize: 14, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.with}</span>
                {c.unread ? <span style={{ background: "var(--brand)", color: "#fff", fontSize: 10, fontWeight: 700, padding: "1px 6px", borderRadius: 999 }}>{c.unread}</span> : null}
              </div>
              <div style={{ fontSize: 12.5, color: "var(--muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.msgs.length ? (c.msgs[c.msgs.length - 1].t || "Shared a link") : "New conversation"}</div>
            </div>
          </button>
        ))}
      </div>

      {/* thread */}
      {active ? (
        <div style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
          <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--rule)", display: "flex", alignItems: "center", gap: 12 }}>
            <Avatar name={active.with} size={38} />
            <div><div style={{ fontWeight: 600, fontSize: 15 }}>{active.with}</div>{active.subtitle && <div style={{ fontSize: 12.5, color: "var(--muted)" }}>{active.subtitle}</div>}</div>
          </div>

          <div ref={threadRef} style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "18px 20px", display: "flex", flexDirection: "column", gap: 12, background: "var(--bg-soft)" }}>
            {store.role === "firm" && withRep && notAcceptingJobs(withRep) && <div className="banner banner-warn" style={{ fontSize: 12.5, padding: "10px 14px" }}><Icon name="info" size={15} style={{ flexShrink: 0 }} /><div><strong>{active.with.split(" ")[0]} isn't accepting new jobs right now.</strong> They may still help with a past transcript or an existing matter, but likely won't take on new work.</div></div>}
            <div style={{ display: "flex", gap: 6, alignItems: "flex-start", justifyContent: "center", maxWidth: 620, margin: "0 auto", padding: "2px 16px 8px", fontSize: 11.5, lineHeight: 1.55, color: "var(--dim)", textAlign: "center" }}><Icon name="shield" size={13} style={{ flexShrink: 0, marginTop: 2 }} /><span>Dewey Sholes carries your messages and links but never stores files – share deliverables through your own secure link. Terms are between you and {active.with}.</span></div>
            {active.msgs.map((m, i) => (
              <div key={i} className={"msg-bubble " + (m.from === "me" ? "msg-me" : "msg-them")}>
                {m.t && <div>{m.t}</div>}
                {m.link && <a href={m.link.url} target="_blank" rel="noopener noreferrer" className="msg-link"><Icon name="link" size={14} /> {m.link.label}</a>}

                  <input className="ds-input" style={{ flex: 1, minWidth: 120, padding: "9px 12px", fontSize: 13 }} placeholder="Label (optional)" value={linkLabel} onChange={(e) => setLinkLabel(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); attachLink(); } }} />

                    <Icon name="shield" size={14} style={{ flexShrink: 0, marginTop: 1 }} />
                    <span>Only share links you control access to (private, access-controlled, or expiring). Dewey Sholes doesn't store, secure, or check your files or links. You're responsible for how sensitive material is shared.</span>
                  </div>
                ) : null}
              </div>
            )}
            {attachedLink && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, padding: "8px 12px", background: "var(--brand-soft)", border: "1px solid var(--brand-pale)", borderRadius: 9, fontSize: 13 }}>
                <Icon name="link" size={15} style={{ color: "var(--brand-dark)", flexShrink: 0 }} />
                <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "var(--ink-soft)" }}><strong style={{ fontWeight: 600, color: "var(--ink)" }}>{attachedLink.label}</strong> · {attachedLink.url}</span>
                <button title="Remove link" onClick={() => setAttachedLink(null)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--muted)", display: "flex", padding: 2 }}><Icon name="x" size={15} /></button>
              </div>
            )}
            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <button title="Attach a secure link" className="chip-filter" style={{ padding: "11px 12px", borderColor: (linkOpen || attachedLink) ? "var(--brand)" : "var(--rule)", color: (linkOpen || attachedLink) ? "var(--brand-dark)" : "var(--ink-soft)" }} onClick={() => setLinkOpen((v) => !v)}><Icon name="link" size={16} /></button>
              <textarea className="ds-input" rows={1} style={{ flex: 1, resize: "none", padding: "11px 14px" }} placeholder={"Message " + active.with + "…"} value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} />
              <button className="btn btn-primary" style={{ padding: "12px 20px" }} onClick={send}>Send</button>
            </div>
            <div style={{ fontSize: 11, color: "var(--dim)", marginTop: 8, textAlign: "center" }}>Sending as {meLabel} · Dewey Sholes doesn't participate in or store your negotiation.</div>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", color: "var(--muted)" }}>No conversation selected.</div>
      )}
    </div>
  );
}

// ═══ Firm dashboard ════════════════════════════════════════════════
function FirmDashboard() {
  const store = useStore();
  const [tab, setTab] = useRouteTab("/firm", ["overview", "saved", "messages", "invoices"], "overview");
  const [bulkOpen, setBulkOpen] = useState(false);
  const all = useMemo(() => buildDirectory(), []);
  const saved = all.filter((r) => store.saved.includes(r.id));
  const unread = store.convos.reduce((n, c) => n + c.unread, 0);
  const firmInvoices = store.invoices.filter((i) => i.client === store.firmName);
  const toPay = firmInvoices.filter((i) => i.status === "sent" || i.status === "overdue").length;
  // Overview stats – the firm-side mirror of the reporter dashboard's top-of-page StatCards.
  const firmPaid = firmInvoices.filter((i) => i.status === "paid").reduce((s, i) => s + i.amount, 0);
  const firmOutstanding = firmInvoices.filter((i) => i.status === "sent" || i.status === "overdue").reduce((s, i) => s + i.amount, 0);
  // "Agency markup avoided" ESTIMATE (see docs/roadmap.md + the never-invent-data rule). Markup = what
  // an agency adds ON TOP of the reporter's direct rate: from the real CA invoice
  // (research/agency_invoice_evidence.md, the same one the homepage money-comparison uses) the agency
  // added ~$907 on a ~$1,404 direct rate = AGENCY_CUT/(1-AGENCY_CUT) of direct spend. Prototype basis =
  // the demo's paid invoices; always labeled an estimate.
  const AGENCY_CUT = 0.39;
  const firmMarkupAvoided = Math.round(firmPaid * (AGENCY_CUT / (1 - AGENCY_CUT)));
  const tabs = [
    { id: "overview", label: "Overview" },
    { id: "saved", label: "Saved reporters", badge: saved.length || null },
    { id: "messages", label: "Messages", badge: unread || null },
    { id: "invoices", label: "Invoices", badge: toPay || null },
  ];
  return (
    <DashLayout title={store.firmName} subtitle="Firm account · Legal Operations" tabs={tabs} active={tab} onTab={setTab}>
      {tab === "overview" && (
        <>
        <div className="ds-note"><Icon name="info" size={15} style={{ flexShrink: 0, color: "var(--dim)" }} /><span><strong style={{ fontWeight: 600, color: "var(--ink-soft)" }}>Sample data</strong> – the payment figures and estimated savings here are illustrative placeholders for the prototype.</span></div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 18 }}>
          <StatCard icon="dollar" label="Paid this month" value={"$" + firmPaid.toLocaleString(undefined, { minimumFractionDigits: 2 })} sub="Invoices you've paid" />
          <StatCard icon="invoice" label="Outstanding" value={"$" + firmOutstanding.toLocaleString(undefined, { minimumFractionDigits: 2 })} sub="Invoiced, awaiting your payment" />
          <StatCard icon="star" label="Estimated savings" value={"~$" + firmMarkupAvoided.toLocaleString()} sub="Est. agency markup avoided by hiring direct" />
        </div>
        </>
      )}
      {tab === "saved" && (
        <>
        {saved.length ? (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
              <span style={{ color: "var(--muted)", fontSize: 14 }}>{saved.length} saved {saved.length === 1 ? "reporter" : "reporters"}</span>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <button className="btn btn-secondary" onClick={() => navigate("/directory")}><Icon name="search" size={16} /> Find more reporters</button>
                <button className="btn btn-primary" onClick={() => setBulkOpen(true)}><Icon name="message" size={16} /> Message reporters</button>
              </div>
            </div>
            {/* List view (same RepRow as the directory), not stacked cards or a horizontal
                scroller - a firm's saved set is a working list to scan and manage, and grows well
                past what cards or a carousel handle. The filled save-heart on each row is the
                un-save affordance. */}
            <div className="dir-list">{saved.map((r) => <RepRow key={r.id} r={r} />)}</div>
          </>
        ) : (
          <div className="ds-panel" style={{ textAlign: "center", padding: 56 }}>
            <Icon name="heart" size={30} style={{ margin: "0 auto", color: "var(--dim)" }} />
            <h3 style={{ fontSize: 22, marginTop: 12 }}>No saved reporters yet</h3>
            <p style={{ color: "var(--muted)", marginTop: 8, maxWidth: 420, margin: "8px auto 0" }}>Browse the directory and tap “Save reporter” on anyone you might want to work with. They'll show up here for your whole team.</p>
            <button className="btn btn-primary" style={{ marginTop: 22 }} onClick={() => navigate("/directory")}><Icon name="search" size={16} /> Browse the directory</button>
          </div>
        )}
        </>
      )}
      {tab === "messages" && <MessagesPanel embedded />}
      {tab === "invoices" && <FirmInvoices />}
      {bulkOpen && <BulkMessageModal reporters={saved} onClose={() => setBulkOpen(false)} />}
    </DashLayout>
  );
}

// A firm's received invoices - pay by card or ACH. Invoices addressed to this firm are those whose
// client === firmName. Paying is real Stripe in production (see integration_checklist.md); simulated
// here. This is the firm-side counterpart to the reporter's invoice list.
function FirmInvoices() {
  const store = useStore();
  const [modalInv, setModalInv] = useState(null);
  const mine = store.invoices.filter((i) => i.client === store.firmName);
  const payable = mine.filter((i) => i.status === "sent" || i.status === "overdue");
  const pay = (inv) => store.updateInvoice(inv.id, { status: "paid", method: "Card", paidAt: "2026-07-17" });
  if (!mine.length) return (
    <div className="ds-panel" style={{ textAlign: "center", padding: 56 }}>
      <Icon name="invoice" size={30} style={{ margin: "0 auto", color: "var(--dim)" }} />
      <h3 style={{ fontSize: 22, marginTop: 12 }}>No invoices yet</h3>
      <p style={{ color: "var(--muted)", marginTop: 8, maxWidth: 440, margin: "8px auto 0" }}>When a reporter sends you an invoice through Dewey Sholes, it lands here to pay by card or ACH. Ask a reporter for one from their profile or your messages.</p>
      <button className="btn btn-primary" style={{ marginTop: 22 }} onClick={() => navigate("/directory")}><Icon name="search" size={16} /> Find a reporter</button>
    </div>
  );
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div className="ds-note"><Icon name="info" size={15} style={{ flexShrink: 0, color: "var(--dim)" }} /><span><strong style={{ fontWeight: 600, color: "var(--ink-soft)" }}>Prototype</strong> – paying is simulated. In production, Pay now opens the reporter's secure Stripe page (card or ACH); no real charge is made here.</span></div>
      {payable.length > 0 && <div style={{ color: "var(--muted)", fontSize: 14 }}>{payable.length} invoice{payable.length === 1 ? "" : "s"} to pay</div>}
      {mine.map((i) => {
        const paid = i.status === "paid";
        return (
          <div key={i.id} className="ds-card" onClick={() => setModalInv(i)} style={{ display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap", cursor: "pointer" }}>
            <div style={{ flex: 1, minWidth: 220 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <span style={{ fontWeight: 700, fontSize: 17, color: "var(--ink)" }}>${i.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
                <InvStatus status={i.status} viewer="firm" />
              </div>
              <div style={{ fontSize: 14, color: "var(--ink-soft)", marginTop: 4 }}>{i.from ? "From " + i.from + " · " : ""}{i.matter}</div>
              <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{i.desc}{i.due ? " · due " + i.due : ""}</div>
            </div>
            {paid
              // The green "Paid" status pill (left, by the amount) already marks it paid; the right
              // side just notes HOW it was paid, in muted grey - no second "Paid" label, no color
              // clash. Nothing here if no method was recorded.
              ? (i.method ? <span style={{ display: "inline-flex", alignItems: "center", gap: 5, color: "var(--muted)", fontSize: 13, whiteSpace: "nowrap" }}><Icon name="check" size={13} /> {i.method === "Card" ? "Card" : i.method}</span> : null)
              : <button className="btn btn-primary" onClick={(e) => { e.stopPropagation(); pay(i); }}><Icon name="dollar" size={16} /> Pay now</button>}
          </div>
        );
      })}
      {modalInv && <InvoiceModal inv={store.invoices.find((i) => i.id === modalInv.id) || modalInv} viewer="firm" onClose={() => setModalInv(null)} />}
    </div>
  );
}

// Draft one message, send it privately to several saved reporters at once - each lands as its own
// 1:1 thread (not a group thread), and reporters never see they were one of several. Scoped
// deliberately as fan-out over existing messaging, NOT a job board. See open_strategic_decisions.md.
function BulkMessageModal({ reporters, onClose }) {
  const store = useStore();
  const CAP = 10;
  const [sel, setSel] = useState(reporters.slice(0, CAP).map((r) => r.id));
  const [text, setText] = useState("");
  const toggle = (id) => setSel((s) => s.includes(id) ? s.filter((x) => x !== id) : (s.length >= CAP ? s : [...s, id]));
  const chosen = reporters.filter((r) => sel.includes(r.id));
  const canSend = text.trim() && chosen.length;
  const send = () => { if (!canSend) return; store.sendToMany(chosen.map((r) => r.name), text.trim()); onClose(); navigate("/firm/messages"); };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="ds-card" style={{ maxWidth: 560, width: "94%", maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
          <div>
            <h3 style={{ fontSize: 22 }}>Message several reporters</h3>
            <p style={{ color: "var(--muted)", fontSize: 13.5, marginTop: 4, lineHeight: 1.5 }}>One message, sent privately to each. Everyone gets their own thread – they never see each other.</p>
          </div>
          <button onClick={onClose} title="Close" style={{ background: "none", border: "none", cursor: "pointer", color: "var(--dim)", padding: 4, flexShrink: 0 }}><Icon name="x" size={20} /></button>
        </div>
        <div style={{ margin: "16px 0" }}>
          <div className="ds-label" style={{ marginBottom: 8 }}>Recipients · {chosen.length} selected{sel.length >= CAP ? " (max " + CAP + ")" : ""}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 3, maxHeight: 230, overflowY: "auto", border: "1px solid var(--rule)", borderRadius: 10, padding: 6 }}>
            {reporters.map((r) => {
              const on = sel.includes(r.id);
              return (
                <label key={r.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 8px", borderRadius: 8, cursor: "pointer", background: on ? "var(--brand-soft)" : "transparent" }}>
                  <input type="checkbox" checked={on} onChange={() => toggle(r.id)} style={{ width: 16, height: 16, accentColor: "var(--brand)", flexShrink: 0 }} />
                  <Avatar name={r.name} size={30} claimed={r.claimed} photo={r.photo} />
                  <div style={{ minWidth: 0, flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</div>
                    <div style={{ fontSize: 12, color: "var(--muted)" }}>{r.city}{r.county && r.county !== r.city ? ", " + r.county + " County" : ""}</div>
                  </div>
                  {notAcceptingJobs(r) ? <span style={{ fontSize: 11, color: "var(--ink-soft)", background: "#F7F8C6", border: "1px solid #DCE224", borderRadius: 6, padding: "2px 7px", whiteSpace: "nowrap", flexShrink: 0 }}>Not taking new work</span> : null}
                </label>
              );
            })}
          </div>
        </div>
        <div>
          <div className="ds-label" style={{ marginBottom: 8 }}>Your message</div>
          <textarea className="ds-input" rows={5} value={text} onChange={(e) => setText(e.target.value)} placeholder="Hi – we have a half-day deposition in Santa Clara on Aug 12, realtime preferred. Are you available, and what would you charge?" />
          <p style={{ fontSize: 12, color: "var(--dim)", marginTop: 8, lineHeight: 1.5 }}>Keep it general (skip names) so the same message reads naturally to everyone. Each reporter replies in their own thread.</p>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 18, flexWrap: "wrap" }}>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={send} disabled={!canSend} style={{ opacity: canSend ? 1 : 0.5 }}><Icon name="message" size={16} /> Send to {chosen.length} {chosen.length === 1 ? "reporter" : "reporters"}</button>
        </div>
      </div>
    </div>
  );
}

// Left section-nav + soft-shadow cards (Stripe/Linear-style). Reached from the header gear; holds
// plan/billing (moved out of the dashboards), notifications, Stripe/payouts, and account.
function SettingsPage() {

// ═══ Store provider ════════════════════════════════════════════════
function StoreProvider({ children }) {
  // Persist the logged-in role across refreshes (prototype convenience) - otherwise React state
  // resets on reload and you're kicked back to logged-out. Logout clears it.
  const [role, setRole] = useState(() => { try { return localStorage.getItem("ds_role") || null; } catch (e) { return null; } });  // null | 'reporter' | 'firm'
  useEffect(() => { try { if (role) localStorage.setItem("ds_role", role); else localStorage.removeItem("ds_role"); } catch (e) {} }, [role]);
  const [myCsr, setMyCsr] = useState("900001");   // demo reporter = Marguerite Ellsworth (sample)
  const [saved, setSaved] = useState(["900004", "900003", "900005"]);
  const [convos, setConvos] = useState(SEED_CONVOS);
  const [invoices, setInvoices] = useState(SEED_INVOICES);
  const [paymentRequests, setPaymentRequests] = useState(SEED_REQUESTS);
  const [customTemplates, setCustomTemplates] = useState([]);
  const [invitedFirms, setInvitedFirms] = useState([]);
  // Unclaimed reporters this firm has invited to join. Persists so the saved list can flag them
  // "Invite sent" until they claim (the flag keys off !claimed, so it clears when they sign up).
  const [invitedReporters, setInvitedReporters] = useState([]);
  const [firmPlan, setFirmPlan] = useState("free");   // 'free' | 'pro'
  const [reporterPlan, setReporterPlan] = useState("payg");   // 'payg' (pay per invoice, 5%) | 'pro' ($29/mo + 2%)
  const [notifPrefs, setNotifPrefs] = useState({ newMessage: true, invoicePaid: true, inviteAccepted: true, weeklyDigest: false });   // Settings > Notifications toggles
  const [firmName, setFirmName] = useState("Morgan & Reyes LLP"); // demo default; set from signup
  // Reporters a free firm may fully view/message: the ones who invited or are connected to them.
  const [unlockedReporters, setUnlockedReporters] = useState(["900004", "900003", "900005"]);
  // Reporters a free firm reached by an EXACT name/license search - "I already know who I want" is
  // not discovery, so it's free. Broad filtered browsing still needs Pro. See directory search.
  const [directUnlocked, setDirectUnlocked] = useState([]);
  // The demo reporter's saved "accepting jobs" setting. Prototype stand-in for the one editable
  // profile field with cross-page display consequences; committed on Save, read by the profile.
  const [myAccepting, setMyAccepting] = useState(true);
  // The demo reporter's saved profile edits (bio, rates, etc.). Prototype in-session persistence so
  // the edit -> save -> "view public profile" loop actually reflects changes (resets on reload).
  const [myProfile, setMyProfile] = useState({});
  const [pendingSave, setPendingSave] = useState(null);   // reporter id a logged-out visitor tried to save; applied after signup
  const [pendingMessage, setPendingMessage] = useState(null);  // reporter name a logged-out visitor tried to message; started after signup
  const [justJoined, setJustJoined] = useState(false);  // set on claim/signup finish so the dashboard greets first-timers with "Welcome" not "Welcome back"

  const store = {
    role, myCsr, saved, convos, invoices, paymentRequests, customTemplates, invitedFirms, invitedReporters, firmPlan, reporterPlan, firmName, unlockedReporters, directUnlocked, myAccepting, setMyAccepting, myProfile, saveMyProfile: (patch) => setMyProfile((p) => ({ ...p, ...patch })), pendingSave, pendingMessage, justJoined,
    // Record that this firm invited an unclaimed reporter (idempotent).
    noteInvite: (id) => setInvitedReporters((xs) => xs.includes(id) ? xs : [...xs, id]),
    // A free firm searched a reporter's exact name or license number - unlock just that reporter.
    noteDirectMatch: (ids) => setDirectUnlocked((u) => { const add = ids.filter((id) => !u.includes(id)); return add.length ? [...u, ...add] : u; }),
    // Firm asks a reporter to invoice them (so payment happens on-platform); reporter fulfills it.
    requestInvoice: (req) => setPaymentRequests((rs) => [{ ...req, id: "REQ-" + Date.now(), status: "pending" }, ...rs]),
    fulfillRequest: (id) => setPaymentRequests((rs) => rs.map((r) => r.id === id ? { ...r, status: "fulfilled" } : r)),
    addTemplate: (t) => setCustomTemplates((xs) => [...xs, t]),
    enterAsReporter: () => setRole("reporter"),
    markJustJoined: () => setJustJoined(true),
    clearJustJoined: () => setJustJoined(false),
    enterAsFirm: (name) => { setRole("firm"); if (name && name.trim()) setFirmName(name.trim()); },
    logout: () => setRole(null),
    upgradeFirm: () => setFirmPlan("pro"),
    downgradeFirm: () => setFirmPlan("free"),
    upgradeReporter: () => setReporterPlan("pro"),
    downgradeReporter: () => setReporterPlan("payg"),
    notifPrefs,
    toggleNotif: (key) => setNotifPrefs((p) => ({ ...p, [key]: !p[key] })),
    toggleSaved: (id) => setSaved((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]),
    inviteFirm: (firm) => setInvitedFirms((xs) => [firm, ...xs]),
    // A firm arriving on a reporter's invite link: create their free account, save + unlock the inviter.
    acceptInvite: (reporterId) => { setRole("firm"); setSaved((s) => s.includes(reporterId) ? s : [...s, reporterId]); setUnlockedReporters((u) => u.includes(reporterId) ? u : [...u, reporterId]); },
    // A logged-out visitor tapped "Save this reporter": remember which reporter, then send them to firm signup.
    queueSave: (reporterId) => setPendingSave(reporterId),
    // A logged-out visitor tapped "Message": remember which reporter, then send them to firm signup.
    queueMessage: (name) => setPendingMessage(name),
    // After firm signup completes: save + unlock the queued reporter, then clear the queue.
    completeSave: () => { if (pendingSave != null) { setSaved((s) => s.includes(pendingSave) ? s : [...s, pendingSave]); setUnlockedReporters((u) => u.includes(pendingSave) ? u : [...u, pendingSave]); setPendingSave(null); } },
    startConvoWith: (name) => setConvos((cs) => cs.some((c) => c.with === name) ? cs
      : [{ id: "new-" + name, with: name, role: "reporter", subtitle: "New conversation", unread: 0, msgs: [{ from: "me", t: "", at: "Just now" }].filter((m) => m.t) }, ...cs]),
    pushMessage: (cid, msg) => setConvos((cs) => cs.map((c) => c.id === cid ? { ...c, msgs: [...c.msgs, msg], unread: 0 } : c)),
    // Send ONE message to MANY reporters as separate 1:1 threads (not a group thread). Each
    // recipient gets an identical opening message in their own conversation; replies split off.
    // Reporters never see they were one of several. See docs/open_strategic_decisions.md.
    sendToMany: (names, text) => setConvos((cs) => {
      const mk = () => ({ from: "me", t: text, at: "Just now" });
      const updated = cs.map((c) => names.includes(c.with) ? { ...c, msgs: [...c.msgs, mk()] } : c);
      const have = new Set(cs.map((c) => c.with));
      const fresh = names.filter((n) => !have.has(n)).map((n) => ({ id: "new-" + n, with: n, role: "reporter", subtitle: "New conversation", unread: 0, msgs: [mk()] }));
      return [...fresh, ...updated];
    }),
    markRead: (cid) => setConvos((cs) => cs.map((c) => c.id === cid ? { ...c, unread: 0 } : c)),
    addInvoice: (inv) => setInvoices((xs) => [inv, ...xs]),
    updateInvoice: (id, patch) => setInvoices((xs) => xs.map((i) => i.id === id ? { ...i, ...patch } : i)),
  };
  return <StoreContext.Provider value={store}>{children}</StoreContext.Provider>;
}

// ═══ Router ════════════════════════════════════════════════════════
function AppRouter() {
  const route = useRoute();
  if (route === "#/signup" || route === "#/signup/") return <SignupChooser />;
  if (route === "#/claim" || route === "#/claim/") return <ClaimStart />;
  const claim = route.match(/^#\/claim\/(.+)$/);
  if (claim) return <ClaimFlow reporterId={decodeURIComponent(claim[1])} />;
  const invited = route.match(/^#\/invite\/(.+)$/);
  if (invited) return <ReporterProfile reporterId={decodeURIComponent(invited[1])} invited />;
  const rp = route.match(/^#\/reporters\/(.+)$/);
  if (rp) return <ReporterProfile reporterId={decodeURIComponent(rp[1])} />;
  if (route === "#/reporters" || route === "#/reporters/") return <ReporterDirectory />;
  if (route.startsWith("#/directory")) return <ReporterDirectory />;
  if (route.startsWith("#/reporter")) return <ReporterDashboard />;
  if (route.startsWith("#/firm-signup")) return <FirmSignup />;
  if (route.startsWith("#/firm")) return <FirmDashboard />;
  if (route.startsWith("#/settings")) return <SettingsPage />;
  if (route.startsWith("#/messages")) return <MessagingPage />;
  if (route.startsWith("#/for-firms")) return <ForFirmsPage />;
  if (route.startsWith("#/for-reporters")) return <ForReportersPage />;
  if (route.startsWith("#/terms")) return <TermsPage />;
  if (route.startsWith("#/privacy")) return <PrivacyPage />;
  if (route.startsWith("#/about")) return <AboutPage />;
  if (route.startsWith("#/contact")) return <ContactPage />;
  return <LandingPage />;
}

function App() {
  useEffect(() => { document.documentElement.dataset.theme = "light"; }, []);
  return <StoreProvider><AppRouter /></StoreProvider>;
}
ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
