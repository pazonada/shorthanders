  const base = all.find((x) => x.id === reporterId);
  // The reporter viewing their OWN profile sees their in-session edits (see saveMyProfile).
  const r = base && store.role === "reporter" && base.id === store.myCsr ? { ...base, ...store.myProfile } : base;
  if (!r) return <Page><div className="ds-panel" style={{ textAlign: "center", padding: 60 }}><h2>Reporter not found</h2><button className="btn btn-secondary" style={{ marginTop: 16 }} onClick={() => navigate("/directory")}>Back to directory</button></div></Page>;

  if (!r.claimed) return <UnclaimedProfile r={r} />;
  if (!invited && firmLocked(store, r)) return <GatedProfile r={r} />;

  const pct = completeness(r);
  const isOwner = store.role === "reporter" && r.id === store.myCsr;
  // Own profile reflects the saved availability from the editor; others use their stored flag.
  const notAccepting = r.id === store.myCsr ? !store.myAccepting : notAcceptingJobs(r);

function ClaimStart() {
  const all = useMemo(() => buildDirectory(), []);
  const [mode, setMode] = useState("license");  // license | name
  const [q, setQ] = useState("");
  const [submitted, setSubmitted] = useState(false);

  const results = useMemo(() => {
    if (!submitted) return null;
    const needle = q.trim().toLowerCase();
    if (!needle) return [];
    if (mode === "license") {
      const digits = needle.replace(/\D/g, "");
      return digits ? all.filter((r) => r.csrNumber === digits) : [];
    }
    return all.filter((r) => r.name.toLowerCase().includes(needle)).slice(0, 15);
  }, [submitted, q, mode, all]);

  const run = () => setSubmitted(true);

  return (
    <Page>
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <div style={{ textAlign: "center" }}>
          <span className="pill pill-tag" style={{ marginBottom: 14, display: "inline-flex" }}>Free to claim & get listed</span>
          <h1 style={{ fontSize: "clamp(34px, 4.4vw, 54px)" }}>Claim your profile</h1>
          <p style={{ fontSize: 17, color: "var(--ink-soft)", marginTop: 14, lineHeight: 1.6 }}>
            You're already listed – every licensed California CSR is. Find your record to control how firms see you, then start invoicing and getting paid. It takes about three minutes.
          </p>
        </div>

        <div className="ds-card" style={{ marginTop: 26 }}>
          <div className="ds-tabs" style={{ marginBottom: 18 }}>
            <button className={"ds-tab" + (mode === "license" ? " on" : "")} onClick={() => { setMode("license"); setSubmitted(false); }}>By license number</button>
            <button className={"ds-tab" + (mode === "name" ? " on" : "")} onClick={() => { setMode("name"); setSubmitted(false); }}>By name</button>
          </div>
          <label className="ds-label">{mode === "license" ? "Your CSR license number" : "Your name"}</label>
          <div style={{ display: "flex", gap: 10 }}>
            <input className="ds-input" placeholder={mode === "license" ? "e.g. 12345" : "e.g. Jordan Rivera"} value={q}
              onChange={(e) => { setQ(e.target.value); setSubmitted(false); }}
              onKeyDown={(e) => { if (e.key === "Enter") run(); }} />
            <button className="btn btn-primary" style={{ whiteSpace: "nowrap" }} onClick={run}><Icon name="search" size={16} /> Find me</button>
          </div>
          <p style={{ fontSize: 12.5, color: "var(--dim)", marginTop: 10 }}>Don't know your number? <button onClick={() => navigate("/directory")} style={claimLinkBtn}>Browse the full directory</button> instead.</p>
        </div>

        {results && (
          <div style={{ marginTop: 22 }}>
            {results.length === 0 ? (
              <div className="ds-panel" style={{ textAlign: "center", padding: 32 }}>
                <p style={{ color: "var(--muted)" }}>No active CSR found for that {mode === "license" ? "license number" : "name"}. Double-check it, or <button onClick={() => navigate("/directory")} style={claimLinkBtn}>browse the directory</button>.</p>
              </div>
            ) : (
              <>
                <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 12 }}>{results.length === 1 ? "Is this you?" : "Pick your record:"}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>{results.map((r) => <ClaimMatch key={r.id} r={r} />)}</div>
              </>
            )}
          </div>
        )}

        <div style={{ display: "flex", gap: 22, justifyContent: "center", marginTop: 30, flexWrap: "wrap", fontSize: 13, color: "var(--muted)" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><Icon name="dollar" size={14} /> Free forever</span>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><Icon name="shield" size={14} /> Verify once with Stripe</span>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><Icon name="eye" size={14} /> You control your listing</span>
        </div>
      </div>
    </Page>
  );
}

// Searchable, alphabetized multi-select for long option lists (areas of law, languages) - matches
// the directory's option sets. Selected items show as removable tags; a search filters the list.
function MultiSelect({ options, value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const opts = useMemo(() => options.slice().sort((a, b) => a.localeCompare(b)), [options]);
  const toggle = (o) => onChange(value.includes(o) ? value.filter((x) => x !== o) : [...value, o]);
  const filtered = opts.filter((o) => o.toLowerCase().includes(q.trim().toLowerCase()));
  return (
    <div>
      <div className="ds-input" style={{ height: "auto", minHeight: 40, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", cursor: "text", padding: 6 }} onClick={() => setOpen((v) => !v)}>
        {value.length === 0 && <span style={{ color: "var(--dim)", padding: "0 4px", fontSize: 14 }}>{placeholder || "Select all that apply"}</span>}
        {value.map((v) => (
          <span key={v} style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "var(--brand-soft)", color: "var(--brand-dark)", borderRadius: 6, padding: "3px 8px", fontSize: 13.5 }}>
            {v}<Icon name="x" size={14} style={{ cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); toggle(v); }} />
          </span>
        ))}
        <Icon name="chevron" size={16} style={{ marginLeft: "auto", color: "var(--dim)" }} />
      </div>
      {open && (
        <div style={{ border: "1px solid var(--rule)", borderRadius: 10, marginTop: 6, background: "var(--bg)", overflow: "hidden" }}>
          <input className="ds-input" style={{ margin: 6, width: "calc(100% - 12px)" }} placeholder="Search…" value={q} onChange={(e) => setQ(e.target.value)} autoFocus />
          <div style={{ maxHeight: 220, overflowY: "auto", padding: 4 }}>
            {filtered.map((o) => {
              const on = value.includes(o);
              return (
                <div key={o} onMouseDown={(e) => e.preventDefault()} onClick={() => toggle(o)} style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 9px", borderRadius: 6, cursor: "pointer", fontSize: 14.5, color: "var(--ink)" }}>
                  <Icon name={on ? "check" : "plus"} size={16} style={{ color: on ? "var(--brand-dark)" : "var(--dim)" }} />{o}
                </div>
              );
            })}
            {filtered.length === 0 && <div style={{ padding: "10px 9px", fontSize: 13.5, color: "var(--muted)" }}>No matches.</div>}
          </div>
        </div>
      )}
    </div>
  );
}

function ClaimFlow({ reporterId }) {
  const store = useStore();
  const all = useMemo(() => buildDirectory(), []);
  const r = all.find((x) => x.id === reporterId);
  const [step, setStep] = useState(0);
  const [stripeState, setStripeState] = useState("idle"); // idle | connecting | done
  // Advancing a step doesn't change the route, so the global scroll-to-top-on-navigation
  // (see _app_01_core.jsx) never fires. Reset scroll ourselves so each step starts at the top
  // instead of holding the position of the Continue button on the previous, taller step. Deferred
  // one frame (as in the messaging thread) so it runs after the browser clamps scroll to the new,
  // shorter step's height - a direct scroll in the effect gets overridden by that clamp.
  React.useEffect(() => { requestAnimationFrame(() => window.scrollTo({ top: 0, left: 0, behavior: "instant" })); }, [step]);
  const rOOS = r && isOutOfState(r);
  const [form, setForm] = useState({ bio: "", yearsExp: "", city: (r && !rOOS && r.city) || "", county: (r && !rOOS && r.county) || "", workMode: rOOS ? "remote" : "", baseState: "California", coverage: (r && !rOOS && r.county) || "", rates: {}, publishRates: false, rush: false, notary: false, proceedings: [], services: [], specialties: [], certifications: [], languages: [], otherStates: (r && r.otherStates) || [] });

  if (!r) return (
    <Page><div className="ds-panel" style={{ textAlign: "center", padding: 60, maxWidth: 520, margin: "0 auto" }}>
      <h2 style={{ fontSize: 26 }}>We couldn't find that license</h2>
      <p style={{ color: "var(--muted)", marginTop: 10 }}>This link may be for a license number that isn't in our active directory. Look yourself up instead.</p>
      <button className="btn btn-primary" style={{ marginTop: 20 }} onClick={() => navigate("/claim")}><Icon name="search" size={16} /> Find my profile</button>
    </div></Page>
  );
  if (r.claimed) return <AlreadyClaimed r={r} />;

  const steps = ["Confirm identity", "Create account", "Verify via Stripe", "Build your profile"];
  const toggle = (key, val) => setForm((f) => ({ ...f, [key]: f[key].includes(val) ? f[key].filter((x) => x !== val) : [...f[key], val] }));

  const finish = () => { store.markJustJoined(); store.enterAsReporter(); navigate("/reporter"); };

  // Real Stripe Connect onboarding when the backend is deployed; otherwise the
  // prototype simulates it so the local demo keeps working.
  const beginStripe = async () => {
    setStripeState("connecting");
    try {
      const resp = await fetch("api/connect/create-account", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ licenseNumber: r.csrNumber, name: r.name, email: r.email }),
      });
      if (resp.ok) {
        const d = await resp.json();
        if (d && d.url) { window.location.href = d.url; return; }
      }
      throw new Error("no stripe backend");
    } catch (e) {
      setTimeout(() => setStripeState("done"), 1200); // demo fallback
    }
  };

  return (
    <Page>
      <div style={{ maxWidth: 680, margin: "0 auto" }}>
        <button onClick={() => navigateBack("/reporters/" + reporterId)} style={{ background: "none", border: "none", color: "var(--muted)", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6, fontSize: 14, marginBottom: 22 }}><Icon name="arrow" size={15} style={{ transform: "rotate(180deg)" }} /> Cancel</button>

        {/* stepper */}
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 30 }}>
          {steps.map((s, i) => (
            <React.Fragment key={s}>
              <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                <div className={"step-dot " + (i < step ? "done" : i === step ? "active" : "todo")}>{i < step ? <Icon name="check" size={15} /> : i + 1}</div>
                <span style={{ fontSize: 13, fontWeight: 600, color: i === step ? "var(--ink)" : "var(--dim)", display: i === step ? "block" : "none" }} className="step-label">{s}</span>
              </div>
              {i < steps.length - 1 && <div style={{ flex: 1, height: 1, background: "var(--rule)" }} />}
            </React.Fragment>
          ))}
        </div>

        <div className="ds-card">
          {step === 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              <h1 style={{ fontSize: 30 }}>Is this you?</h1>
              <div className="ds-panel" style={{ display: "flex", gap: 16, alignItems: "center" }}>
                <Avatar name={r.name} size={56} claimed={false} />
                <div>
                  <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 24 }}>{r.name}</div>
                  <div style={{ color: "var(--muted)", fontSize: 14, marginTop: 2 }}>CSR #{r.csrNumber} · {isOutOfState(r) ? "Out of state" : r.city + ", CA"} · License active</div>
                </div>
              </div>
              <p style={{ color: "var(--ink-soft)", fontSize: 15, lineHeight: 1.6 }}>Claiming this profile lets you control how firms see you and unlocks invoicing and payments. You'll verify your identity in a moment so firms know it's really you.</p>
              <div style={{ display: "flex", gap: 12 }}>
                <button className="btn btn-primary" onClick={() => setStep(1)}>Yes, this is me <Icon name="arrow" size={16} /></button>
                <button className="btn btn-secondary" onClick={() => navigateBack("/directory")}>That's not me</button>
              </div>
            </div>
          )}

          {step === 1 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              <h1 style={{ fontSize: 30 }}>Create your account</h1>
              <div className="banner banner-info"><Icon name="lock" size={18} style={{ flexShrink: 0 }} /><div>Prototype – this is a demo. No real account is created and nothing you type is stored or sent.</div></div>
              <div><label className="ds-label">Work email</label><input className="ds-input" type="email" placeholder="you@example.com" /></div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <div><label className="ds-label">Create a password</label><input className="ds-input" type="password" placeholder="••••••••" /></div>
                <div><label className="ds-label">Mobile (for sign-in codes)</label><input className="ds-input" type="tel" placeholder="(555) 000-0000" /></div>
              </div>
              <div style={{ display: "flex", gap: 12, marginTop: 4 }}>
                <button className="btn btn-primary" onClick={() => setStep(2)}>Continue <Icon name="arrow" size={16} /></button>
                <button className="btn btn-secondary" onClick={() => setStep(0)}>Back</button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              <h1 style={{ fontSize: 30 }}>Verify your identity</h1>
              <p style={{ color: "var(--ink-soft)", fontSize: 15, lineHeight: 1.6 }}>We use <strong>Stripe Connect</strong> to confirm you're a licensed reporter and to set up payouts. Stripe handles identity, tax, and banking – Dewey Sholes never sees your bank details or ID documents.</p>
              <div className="ds-panel" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <StripeCheck label="Confirm your legal name & license" />
                <StripeCheck label="Verify your identity (ID document)" />
                <StripeCheck label="Add a bank account for payouts" />
                <StripeCheck label="Complete tax onboarding (W-9)" />
              </div>
              {stripeState === "done" ? (
                <div className="banner banner-ok"><Icon name="check" size={18} style={{ flexShrink: 0 }} /><div><strong>Identity verified.</strong> Your payout account is connected. You can start invoicing right away.</div></div>
              ) : (
                <button className="btn btn-primary" style={{ justifyContent: "center", background: "#635BFF" }} disabled={stripeState === "connecting"}
                  onClick={beginStripe}>
                  {stripeState === "connecting" ? "Redirecting to Stripe…" : <>Continue to Stripe <Icon name="arrow" size={16} /></>}
                </button>
              )}
              <div style={{ display: "flex", gap: 12 }}>
                <button className="btn btn-primary" disabled={stripeState !== "done"} style={{ opacity: stripeState === "done" ? 1 : 0.4 }} onClick={() => setStep(3)}>Continue <Icon name="arrow" size={16} /></button>
                <button className="btn btn-secondary" onClick={() => setStep(1)}>Back</button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              <h1 style={{ fontSize: 30 }}>Build your profile</h1>
              <p style={{ color: "var(--muted)", fontSize: 14 }}>A complete profile ranks higher and earns firms' trust. Fill in what applies to you.</p>

              <div style={{ background: "var(--brand-soft)", border: "1px solid var(--brand-pale)", borderRadius: 12, padding: "14px 16px" }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "var(--brand-dark)", display: "flex", alignItems: "center", gap: 6 }}><Icon name="badge" size={15} /> From your California license record</div>
                <p style={{ fontSize: 12.5, color: "var(--brand-dark)", margin: "4px 0 12px", lineHeight: 1.5 }}>Prefilled from the state's CSR records. Name, license, and method come from the state.{rOOS ? " Your license lists an out-of-state address, so you'll take California work remotely." : " Edit your city or county if you've moved."}</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 22px", fontSize: 14, color: "var(--ink-soft)", marginBottom: 14 }}>
                  <span><strong style={{ color: "var(--ink)", fontWeight: 600 }}>{r.name}</strong></span>
                  <span>CSR #{r.csrNumber}</span>
                  {r.method ? <span>{r.method}</span> : null}
                  <span>License active</span>
                </div>
                {rOOS ? (
                  <div style={{ fontSize: 14, color: "var(--ink-soft)" }}><label className="ds-label">Location</label>Based out of state</div>

// Route-backed dashboard tabs: derive the active tab from the hash and switch by navigating, so
// each tab is a real browser-history entry. That makes the browser Back button return to the
// previous tab instead of jumping out of the dashboard - no "back" text links needed.
function useRouteTab(base, tabIds, defaultTab) {
  const route = useRoute();
  const m = route.match(new RegExp("^#" + base + "/([a-z]+)"));
  const tab = m && tabIds.indexOf(m[1]) !== -1 ? m[1] : defaultTab;
  const setTab = (id) => navigate(id === defaultTab ? base : base + "/" + id);
  return [tab, setTab];
}

// ═══ Reporter dashboard ════════════════════════════════════════════
function ReporterDashboard() {
  const store = useStore();
  // Greet a brand-new reporter with "Welcome"; returning reporters with "Nice to see you". Capture the
  // flag once on mount so the title is stable, then clear it so later visits read as returns.
  const [firstVisit] = useState(store.justJoined);
  useEffect(() => { if (store.justJoined) store.clearJustJoined(); }, []);
  const [tab, setTab] = useRouteTab("/reporter", ["overview", "profile", "payments", "invoices", "messages"], "overview");
  const [inviteOpen, setInviteOpen] = useState(false);
  // Returning from real Stripe onboarding lands here – treat the reporter as signed in.
  // Being on the reporter dashboard means you're acting as the reporter - set the role if it
  // isn't already, so navigating straight here (no explicit login) still treats you as the owner
  // on your own public profile (otherwise rates/edits look gated, as to an outside viewer).
  useEffect(() => { if (store.role !== "reporter") store.enterAsReporter(); }, []);
  const me = useMemo(() => { const all = buildDirectory(); const base = all.find((x) => x.id === store.myCsr) || all.find((x) => x.claimed); return { ...base, ...store.myProfile }; }, [store.myCsr, store.myProfile]);
  const invoices = store.invoices;
  const unread = store.convos.reduce((n, c) => n + c.unread, 0);
  const paidThisMonth = invoices.filter((i) => i.status === "paid").reduce((s, i) => s + i.amount, 0);
  const outstanding = invoices.filter((i) => i.status === "sent" || i.status === "overdue").reduce((s, i) => s + i.amount, 0);
  // Feel-good "money kept from an agency" ESTIMATE (see docs/roadmap.md + the never-invent-data rule).
  // Benchmark = the real ~39% agency cut from research/agency_invoice_evidence.md - the same invoice
  // the homepage money-comparison uses - minus the reporter's small DS fee. Always labeled an estimate;
  // in the prototype it's computed from the demo invoices. Cheap read-time calc, no background job.
  const AGENCY_CUT = 0.39, DS_FEE = 0.05;
  const estSavedVsAgency = Math.round(paidThisMonth * (AGENCY_CUT - DS_FEE));

  const tabs = [
    { id: "overview", label: "Overview" },

      headerRight={

          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
            <button className="btn btn-primary" onClick={() => navigate("/reporter/invoices/new")}><Icon name="plus" size={16} /> New invoice</button>
            <button onClick={() => navigate("/reporters/" + me.id)} style={{ background: "none", border: "none", color: "var(--brand)", cursor: "pointer", fontSize: 13, fontWeight: 500, display: "inline-flex", alignItems: "center", gap: 5, padding: 0 }}><Icon name="eye" size={14} /> View public profile</button>
          </div>
        </div>
      }>
      <div className="ds-note"><Icon name="info" size={15} style={{ flexShrink: 0, color: "var(--dim)" }} /><span><strong style={{ fontWeight: 600, color: "var(--ink-soft)" }}>Sample data</strong> – the invoices, payments, stats, and messages here are illustrative placeholders for the prototype.</span></div>
      {tab === "overview" && (
        <>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 18 }}>
          <StatCard icon="dollar" label="Paid this month" value={"$" + paidThisMonth.toLocaleString(undefined, { minimumFractionDigits: 2 })} sub={"Est. ~$" + estSavedVsAgency.toLocaleString() + " saved vs. an agency"} />
          <StatCard icon="invoice" label="Outstanding" value={"$" + outstanding.toLocaleString(undefined, { minimumFractionDigits: 2 })} sub="Invoiced, awaiting payment" />
          <StatCard icon="eye" label="Profile views (30d)" value={me.views} sub={(me.saves || 0) + " firms saved your profile"} />

          <div className="ds-card flat" style={{ gridColumn: "1 / -1", marginTop: 20, display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap", background: "var(--brand-soft)", borderColor: "var(--brand-pale)" }}>
            <div style={{ width: 46, height: 46, borderRadius: 12, background: "var(--brand)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon name="mail" size={22} /></div>
            <div style={{ flex: 1, minWidth: 220 }}>

function ToggleSwitch({ on, onClick }) {
  return (
    <button type="button" role="switch" aria-checked={on} onClick={onClick} style={{ width: 46, height: 27, borderRadius: 999, border: "none", cursor: "pointer", padding: 3, background: on ? "var(--brand)" : "var(--rule-strong)", display: "inline-flex", alignItems: "center", flexShrink: 0, transition: "background .15s ease" }}>
      <span style={{ width: 21, height: 21, borderRadius: "50%", background: "#fff", display: "block", transform: on ? "translateX(19px)" : "translateX(0)", transition: "transform .15s ease", boxShadow: "0 1px 2px rgba(0,0,0,.25)" }} />
    </button>
  );
}
function chipStyle(on) {
  return { fontSize: 13, padding: "6px 13px", borderRadius: 999, cursor: "pointer", fontFamily: "'Inter', sans-serif",
    border: on ? "1px solid var(--brand)" : "1px solid var(--rule-strong)", background: on ? "var(--brand-soft)" : "var(--bg)",
    color: on ? "var(--brand-dark)" : "var(--ink-soft)", fontWeight: on ? 600 : 400, display: "inline-flex", alignItems: "center", gap: 5 };
}
function FieldBlock({ label, hint, children }) {
  return (
    <div>
      <label className="ds-label" style={{ marginBottom: hint ? 3 : 7 }}>{label}</label>
      {hint ? <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 9, lineHeight: 1.5 }}>{hint}</div> : null}
      {children}
    </div>
  );
}
// Toggle chips for a small fixed list (proceedings, services, languages, credentials, availability).
function ChipToggle({ options, selected, onToggle, extra }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
      {options.map((opt) => {
        const val = typeof opt === "string" ? opt : opt.code;
        const label = typeof opt === "string" ? opt : opt.label;
        const on = selected.includes(val);
        return <button key={val} type="button" onClick={() => onToggle(val)} style={chipStyle(on)}>{on ? <Icon name="check" size={13} /> : null}{label}</button>;
      })}
      {extra || null}
    </div>
  );
}
// Search-to-add picker with removable chips, for long lists (areas of law, counties). allowOther
// lets the reporter add a value not in the list.
function TagSearchAdd({ options, selected, onChange, placeholder, allowOther }) {
  const [q, setQ] = useState("");
  const query = q.trim();
  const lower = query.toLowerCase();
  const matches = query ? options.filter((o) => !selected.includes(o) && o.toLowerCase().indexOf(lower) !== -1).slice(0, 8) : [];
  const exists = !query || options.some((o) => o.toLowerCase() === lower) || selected.some((o) => o.toLowerCase() === lower);
  const add = (v) => { if (v && !selected.includes(v)) onChange(selected.concat([v])); setQ(""); };
  return (
    <div>
      {selected.length > 0 ? (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
          {selected.map((v) => (
            <span key={v} className="pill pill-verified" style={{ fontSize: 13, padding: "6px 8px 6px 13px", display: "inline-flex", alignItems: "center", gap: 7 }}>
              {v}
              <button type="button" onClick={() => onChange(selected.filter((x) => x !== v))} aria-label={"Remove " + v} style={{ background: "none", border: "none", padding: 0, cursor: "pointer", color: "var(--brand-dark)", display: "flex" }}><Icon name="x" size={12} /></button>
            </span>
          ))}
        </div>
      ) : null}
      <div style={{ position: "relative" }}>
        <input className="ds-input" value={q} onChange={(e) => setQ(e.target.value)} placeholder={placeholder} onKeyDown={(e) => { if (e.key === "Enter" && allowOther && query) { e.preventDefault(); add(query); } }} />
        {(matches.length > 0 || (allowOther && query && !exists)) ? (
          <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 5, background: "var(--bg)", border: "1px solid var(--rule-strong)", borderRadius: 10, boxShadow: "var(--shadow-md)", overflow: "hidden", maxHeight: 240, overflowY: "auto" }}>
            {matches.map((m) => <button key={m} type="button" onClick={() => add(m)} style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 13px", background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "var(--ink-soft)" }}>{m}</button>)}
            {allowOther && query && !exists ? <button type="button" onClick={() => add(query)} style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", textAlign: "left", padding: "9px 13px", background: "var(--bg-soft)", border: "none", cursor: "pointer", fontSize: 14, color: "var(--brand-dark)", fontWeight: 500 }}><Icon name="plus" size={13} /> Add "{query}"</button> : null}
          </div>
        ) : null}
      </div>
    </div>
  );
}
// One rate line: an optional low and high. Blank = not shown; one = set rate; both = a range.
function RateRow({ label, unit, value, onChange, extra }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
      <div style={{ flex: 1, minWidth: 150 }}>
        <div style={{ fontSize: 14, color: "var(--ink)" }}>{label}</div>
        <div style={{ fontSize: 12, color: "var(--dim)" }}>{unit}</div>
      </div>
      {extra || null}
      <input className="ds-input" style={{ width: 82 }} placeholder="Low" value={value.low} onChange={(e) => onChange({ low: e.target.value, high: value.high })} />
      <span style={{ color: "var(--dim)" }}>–</span>
      <input className="ds-input" style={{ width: 82 }} placeholder="High" value={value.high} onChange={(e) => onChange({ low: value.low, high: e.target.value })} />
    </div>
  );
}
function ReporterProfileEditor({ me }) {
  const store = useStore();
  const [toast, setToast] = useState("");
  const counties = useMemo(() => Array.from(new Set(buildDirectory().map((r) => r.county).filter((c) => c && c !== "Out of State"))).sort(), []);
  const [photo, setPhoto] = useState(me.photo || "");
  const [bio, setBio] = useState(me.bio || "");
  const [years, setYears] = useState(me.yearsExp || "");
  const [proceedings, setProceedings] = useState(me.proceedings || []);
  const [services, setServices] = useState(me.services || []);
  const [areas, setAreas] = useState(me.specialties || []);
  const [languages, setLanguages] = useState(me.languages || []);
  const [certs, setCerts] = useState(() => CREDENTIAL_TYPES.map((c) => c.code).filter((code) => (me.certifications || []).some((x) => x.indexOf(code) !== -1)));
  const [coverage, setCoverage] = useState(me.coverage || []);
  const [otherStates, setOtherStates] = useState(me.otherStates || []);
  const [notary, setNotary] = useState(!!me.notary);
  const [rush, setRush] = useState(!!me.rush);
  // Draft, seeded from the saved value. Committed to the store on Save, then read by the profile.
  const [accepting, setAccepting] = useState(store.myAccepting);
  const [showRates, setShowRates] = useState(!!me.publishRates);
  const blankRates = { pageOriginal: { low: "", high: "" }, pageCopy: { low: "", high: "" }, halfDay: { low: "", high: "" }, fullDay: { low: "", high: "" }, trialDay: { low: "", high: "" }, expedited: { low: "", high: "" }, realtime: { low: "", high: "" } };
  const [rates, setRates] = useState(() => (me._rateDraft && me._rateDraft.rates) || blankRates);
  const [expUnit, setExpUnit] = useState((me._rateDraft && me._rateDraft.expUnit) || "percent");
  const [customRates, setCustomRates] = useState(() => (me._rateDraft && me._rateDraft.customRates) || []);

  const toggleIn = (setter) => (v) => setter((cur) => cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat([v]));
  const setRate = (key) => (val) => setRates((r) => Object.assign({}, r, { [key]: val }));
  const updateCustom = (i, k, v) => setCustomRates((cur) => cur.map((c, j) => j === i ? Object.assign({}, c, { [k]: v }) : c));
  const photoPick = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => setPhoto(reader.result);
    reader.readAsDataURL(f);
  };

  // Format one rate line for the public profile: "$low–$high", "$one", or a % surcharge.
  const rateStr = (v) => {
    const lo = (v.low || "").toString().trim(), hi = (v.high || "").toString().trim();
    if (!lo && !hi) return null;
    return lo && hi ? "$" + lo + "–$" + hi : "$" + (lo || hi);
  };
  const expStr = (v) => {
    const lo = (v.low || "").toString().trim(), hi = (v.high || "").toString().trim();
    if (!lo && !hi) return null;
    if (expUnit === "percent") return lo && hi ? lo + "%–" + hi + "%" : "+" + (lo || hi) + "%";
    // $ amount: append the unit so the profile reads clearly (a flat fee vs a per-page surcharge).
    return rateStr(v) + (expUnit === "flat" ? " flat" : " / page");
  };
  const buildRateLines = () => [
    ["Transcript – original (per page)", rateStr(rates.pageOriginal)],
    ["Transcript – copy (per page)", rateStr(rates.pageCopy)],
    ["Appearance – half day", rateStr(rates.halfDay)],
    ["Appearance – full day", rateStr(rates.fullDay)],
    ["Trial day", rateStr(rates.trialDay)],
    ["Expedited / rush", expStr(rates.expedited)],
    ["Realtime / rough draft add-on", rateStr(rates.realtime)],
  ].concat(customRates.map((c) => [(c.label || "").trim(), rateStr({ low: c.low, high: c.high })]))
   .filter(([label, val]) => label && val);

  const saveProfile = () => {
    const rateLines = buildRateLines();
    store.saveMyProfile({
      photo, bio, yearsExp: years, proceedings, services, specialties: areas, languages,
      certifications: ["CSR #" + me.csrNumber].concat(certs), coverage, otherStates, notary, rush,
      publishRates: showRates, rateLines, _rateDraft: { rates, expUnit, customRates },
    });
    store.setMyAccepting(accepting);
    setToast("Profile saved");
  };

  return (
    <div style={{ maxWidth: 720, display: "flex", flexDirection: "column", gap: 22 }}>
      <FieldBlock label="Profile photo" hint="A clear headshot helps firms recognize you. Optional.">
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <Avatar name={me.name} size={72} claimed photo={photo} />
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <label className="btn btn-secondary" style={{ cursor: "pointer" }}><Icon name="user" size={16} /> {photo ? "Change photo" : "Upload photo"}<input type="file" accept="image/*" onChange={photoPick} style={{ display: "none" }} /></label>
            {photo ? <button className="btn btn-secondary" onClick={() => setPhoto("")}>Remove</button> : null}
          </div>
        </div>
      </FieldBlock>

      <FieldBlock label="Bio">
        <textarea className="ds-input" rows={4} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="A few sentences about your practice, experience, and how you work." />
      </FieldBlock>

      <div style={{ maxWidth: 200 }}>
        <FieldBlock label="Years of experience">
          <input className="ds-input" type="number" min="0" value={years} onChange={(e) => setYears(e.target.value)} placeholder="Years" />
        </FieldBlock>
      </div>

      <FieldBlock label="Proceedings covered"><ChipToggle options={PROCEEDING_TYPES} selected={proceedings} onToggle={toggleIn(setProceedings)} /></FieldBlock>
      <FieldBlock label="Services offered"><ChipToggle options={SERVICE_TYPES} selected={services} onToggle={toggleIn(setServices)} extra={<><button type="button" onClick={() => setRush(!rush)} style={chipStyle(rush)}>{rush ? <Icon name="check" size={13} /> : null}Accepts rush / expedited</button><button type="button" onClick={() => setNotary(!notary)} style={chipStyle(notary)}>{notary ? <Icon name="check" size={13} /> : null}Notary public</button></>} /></FieldBlock>
      <FieldBlock label="Area of law" hint="Pick from the California State Bar list, or type your own and press Enter to add it.">
        <TagSearchAdd options={SPECIALTY_TYPES} selected={areas} onChange={setAreas} placeholder="Search areas of law, or type your own" allowOther />
      </FieldBlock>
      <FieldBlock label="Languages" hint="Languages you work in besides English. Pick from the list or type your own to add it."><TagSearchAdd options={LANGUAGES} selected={languages} onChange={setLanguages} placeholder="Search languages, or type your own" allowOther /></FieldBlock>
      <FieldBlock label="Certifications"><ChipToggle options={CREDENTIAL_TYPES} selected={certs} onToggle={toggleIn(setCerts)} /></FieldBlock>
      <FieldBlock label="Counties covered"><TagSearchAdd options={counties} selected={coverage} onChange={setCoverage} placeholder="Search California counties" /></FieldBlock>
      <FieldBlock label="Also certified in" hint="Other states where you're licensed or certified. California is your base directory, so it's not listed here."><TagSearchAdd options={US_STATES} selected={otherStates} onChange={setOtherStates} placeholder="Search states" /></FieldBlock>
      <FieldBlock label="Availability" hint="When this is off, you still appear in search and firms can still message you (say, to ask for a past transcript) - your profile just shows that you're not taking new work right now.">
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <ToggleSwitch on={accepting} onClick={() => setAccepting(!accepting)} />
          <span style={{ fontSize: 14, fontWeight: 500, color: accepting ? "var(--ink)" : "var(--muted)" }}>{accepting ? "Accepting jobs" : "Not accepting jobs right now"}</span>
        </div>
      </FieldBlock>

      <div style={{ borderTop: "1px solid var(--rule)", paddingTop: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
          <div style={{ flex: 1, minWidth: 240 }}>
            <label className="ds-label" style={{ marginBottom: 3 }}>Rates</label>
            <div style={{ fontSize: 12, color: "var(--muted)", lineHeight: 1.5 }}>Share as much or as little as you like - one number for a set rate, a low and high for a range, or leave a line blank to keep it private.</div>
          </div>
          <button type="button" onClick={() => setShowRates(!showRates)} style={chipStyle(showRates)}>{showRates ? <Icon name="eye" size={13} /> : null}{showRates ? "Shown on profile" : "Hidden - tap to show"}</button>
        </div>
        {showRates ? (
          <div style={{ marginTop: 18, display: "flex", flexDirection: "column", gap: 14 }}>
            <RateRow label="Per page - original transcript" unit="$ per page" value={rates.pageOriginal} onChange={setRate("pageOriginal")} />
            <RateRow label="Per page - each copy" unit="$ per page" value={rates.pageCopy} onChange={setRate("pageCopy")} />
            <RateRow label="Half day - appearance" unit="$ per half day" value={rates.halfDay} onChange={setRate("halfDay")} />
            <RateRow label="Full day - appearance" unit="$ per day" value={rates.fullDay} onChange={setRate("fullDay")} />
            <RateRow label="Trial day" unit="$ per day" value={rates.trialDay} onChange={setRate("trialDay")} />
            <RateRow label="Expedited / rush" unit={expUnit === "percent" ? "% surcharge on base rate" : expUnit === "flat" ? "$ flat fee" : "$ per page"} value={rates.expedited} onChange={setRate("expedited")} extra={<select className="ds-input" style={{ width: 162 }} value={expUnit} onChange={(e) => setExpUnit(e.target.value)}><option value="percent">% surcharge</option><option value="perpage">Per page</option><option value="flat">Flat fee</option></select>} />
            <RateRow label="Realtime / rough draft add-on" unit="$ per page or day" value={rates.realtime} onChange={setRate("realtime")} />
            {customRates.map((cr, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <input className="ds-input" style={{ flex: 1, minWidth: 150 }} placeholder="Rate name (e.g. Interpreter surcharge)" value={cr.label} onChange={(e) => updateCustom(i, "label", e.target.value)} />
                <input className="ds-input" style={{ width: 82 }} placeholder="Low" value={cr.low} onChange={(e) => updateCustom(i, "low", e.target.value)} />
                <span style={{ color: "var(--dim)" }}>–</span>
                <input className="ds-input" style={{ width: 82 }} placeholder="High" value={cr.high} onChange={(e) => updateCustom(i, "high", e.target.value)} />
                <button type="button" onClick={() => setCustomRates(customRates.filter((_, j) => j !== i))} aria-label="Remove rate" style={{ background: "none", border: "none", cursor: "pointer", color: "var(--dim)", display: "flex" }}><Icon name="x" size={16} /></button>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "flex-end" }}><button type="button" onClick={() => setCustomRates(customRates.concat([{ label: "", low: "", high: "" }]))} style={{ background: "none", border: "none", color: "var(--brand-dark)", cursor: "pointer", fontSize: 13, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 5, padding: "4px 2px" }}><Icon name="plus" size={14} /> Add another rate</button></div>
          </div>
        ) : null}
      </div>

      <div style={{ display: "flex", gap: 18, alignItems: "center", flexWrap: "wrap" }}>
        <button className="btn btn-primary" onClick={saveProfile}><Icon name="check" size={16} /> Save changes</button>
        <button onClick={() => navigate("/reporters/" + me.id)} style={{ background: "none", border: "none", color: "var(--brand)", cursor: "pointer", fontSize: 14, fontWeight: 500, display: "inline-flex", alignItems: "center", gap: 6, padding: 0 }}><Icon name="eye" size={15} /> View public profile</button>
      </div>
      <Toast msg={toast} onClose={() => setToast("")} />
    </div>
  );
}

function ReporterPayments({ invoices, paidThisMonth }) {
  const paid = invoices.filter((i) => i.status === "paid");
  const [modalInv, setModalInv] = useState(null);
  // What firms owe right now – the honest figure the platform can actually compute. A fixed "next
  // payout" date was fabricated: DS can't know when a firm will pay, and a payout date only exists
  // once Stripe reports money in transit. See docs/integration_checklist.md §3.
  const awaiting = invoices.filter((i) => i.status === "sent" || i.status === "overdue").reduce((s, i) => s + i.amount, 0);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 16 }}>
        <StatCard icon="dollar" label="Paid this month" value={"$" + paidThisMonth.toLocaleString(undefined, { minimumFractionDigits: 2 })} />
        <StatCard icon="clock" label="Awaiting payment" value={"$" + awaiting.toLocaleString(undefined, { minimumFractionDigits: 2 })} />
        <StatCard icon="invoice" label="Payments received" value={paid.length} />
      </div>
      <div className="ds-card" style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "18px 22px", borderBottom: "1px solid var(--rule)" }}><h3 style={{ fontSize: 22 }}>Recent payments</h3></div>
        <div style={{ overflowX: "auto" }}>
          <table className="ds-table">
            <thead><tr><th>Invoice</th><th>Client</th><th>Method</th><th>Date</th><th style={{ textAlign: "right" }}>Amount</th></tr></thead>
            <tbody>{paid.length ? paid.map((i) => <tr key={i.id} style={{ cursor: "pointer" }} onClick={() => setModalInv(i)}><td style={{ fontWeight: 600, color: "var(--ink)" }}>{i.id}</td><td>{i.client}</td><td>{i.method || "Card"}</td><td>{i.date}</td><td style={{ textAlign: "right", fontWeight: 600, color: "var(--ink)" }}>${i.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>) : <tr><td colSpan={5} style={{ textAlign: "center", color: "var(--muted)", padding: 30 }}>No payments yet.</td></tr>}</tbody>
          </table>
        </div>
      </div>
      {modalInv && <InvoiceModal inv={modalInv} viewer="reporter" onClose={() => setModalInv(null)} />}
    </div>
  );
}

// ═══ Reporter invoices ═════════════════════════════════════════════
const INV_STATUS = { draft: ["inv-draft", "Draft"], sent: ["inv-sent", "Sent"], paid: ["inv-paid", "Paid"], overdue: ["inv-overdue", "Overdue"] };
function InvStatus({ status, viewer }) {
  const [cls, base] = INV_STATUS[status];
  // "Sent" is written from the reporter's side (they sent it). To the firm (the payer) that same
  // invoice is one awaiting THEIR payment, not something they sent - so relabel it for the firm
  // viewer, keeping the same pill styling.
  const label = viewer === "firm" && status === "sent" ? "Awaiting payment" : base;
  return <span className={"inv-status " + cls}>{label}</span>;
}

// Regime-aware starter templates (see mvp/docs/csr_profile_field_taxonomy.md).
// Line-item STRUCTURE only – no prefilled rates. Dewey Sholes doesn't set rates;
// reporters fill in their own.
// `rateKey` maps a line to a field in the reporter's saved `rates` (RATE_FIELDS in _app_02_data),
// so the builder can pre-fill the Rate cell from their own profile. Only clean per-unit-dollar
// fields are mapped; composite/percentage lines (O&2, rush %) stay manual (Tier 2). See docs.
const INVOICE_TEMPLATES = [
  { id: "depo", name: "Standard deposition", hint: "Original + copies + appearance", lines: [
    { desc: "Certified transcript, original (per page)", kind: "unit", qty: "", rate: "", rateKey: "pageOriginal" },
    { desc: "Copy (per page)", kind: "unit", qty: "", rate: "", rateKey: "pageCopy" },
    { desc: "Appearance (half day)", kind: "flat", qty: "1", rate: "", rateKey: "perDiemHalf" },
  ] },
  { id: "wc", name: "Workers' comp", hint: "O&2, minimum, statement on the record", lines: [
    { desc: "Original + 2 copies (O&2), per page", kind: "unit", qty: "", rate: "" },
    { desc: "Minimum transcript fee", kind: "flat", qty: "1", rate: "" },
    { desc: "Statement on the record / appearance", kind: "flat", qty: "1", rate: "", rateKey: "perDiemHalf" },
  ] },
  { id: "audio", name: "Court-audio transcription", hint: "Per page or per audio hour", lines: [
    { desc: "Transcription (per page)", kind: "unit", qty: "", rate: "", rateKey: "transcription" },
    { desc: "Certification", kind: "flat", qty: "1", rate: "" },
  ] },
  { id: "blank", name: "Blank invoice", hint: "Build your own from scratch", lines: [
    { desc: "", kind: "unit", qty: "1", rate: "" },
  ] },
];

// Surcharges a reporter can layer onto ANY invoice with one tap.
const INVOICE_ADDONS = [
  "Realtime hookup (hourly)",
  "Expedited / daily turnaround",
  "Rough draft / ASCII",
  "Travel",
  "Waiting time",
];

// Pull a plain number out of a saved rate string ("$4.50", "$1.25/pg" -> 4.5, 1.25). Returns null
// for blanks or percentage rates ("+50%") - those aren't per-unit dollars, so they stay manual.
function parseRate(str) {
  if (str == null) return null;
  const s = String(str);
  if (s.indexOf("%") !== -1) return null;
  const m = s.replace(/,/g, "").match(/\d+(\.\d+)?/);
  if (!m) return null;
  const n = Number(m[0]);
  return isFinite(n) ? n : null;
}

// Turn a stored invoice (or a firm's payment request) back into editable builder state.
function invoiceToLines(inv) {
  if (inv.lineItems && inv.lineItems.length) return inv.lineItems.map((l) => l.flat
    ? { desc: l.desc, kind: "flat", qty: "1", rate: l.amount != null ? String(l.amount) : "" }
    : { desc: l.desc, kind: "unit", qty: String(l.qty), rate: String(l.rate) });
  return [{ desc: inv.desc || "", kind: "flat", qty: "1", rate: inv.amount ? String(inv.amount) : "" }];
}

function ReporterInvoices() {
  const store = useStore();
  const [src, setSrc] = useState(null);            // builder source: { template } | { prefill } | { invoice } | { template, prefill }
  const [pendingReq, setPendingReq] = useState(null);  // a firm's request, carried through the picker into the builder
  const [modalInv, setModalInv] = useState(null);
  const invoices = store.invoices;
  // View is DERIVED FROM THE URL so the browser Back button and the in-app Back button can't diverge:
  // /invoices = list, /invoices/new = template picker, /invoices/build = the builder (needs a src).
  const route = useRoute();
  const view = /\/invoices\/build$/.test(route) ? (src ? "build" : "template")
    : /\/invoices\/new$/.test(route) ? "template" : "list";
  const pickerPrefill = pendingReq || (src && src.prefill) || null;
  const myName = useMemo(() => { const r = buildDirectory().find((x) => x.id === store.myCsr); return r ? r.name : ""; }, [store.myCsr]);
  const requests = store.paymentRequests.filter((q) => q.status === "pending" && q.reporterName === myName);
  // A firm asked us to invoice them. Route through the template picker (carrying the request) so the
  // reporter picks a structure - the firm + matter come pre-filled, and picking "Blank" keeps the
  // firm's requested amount as a single line.
  const acceptRequest = (q) => { store.fulfillRequest(q.id); setPendingReq(q); setSrc(null); navigate("/reporter/invoices/new"); };
  const pickTemplate = (t) => { setSrc(pickerPrefill ? { template: t, prefill: pickerPrefill } : { template: t }); navigate("/reporter/invoices/build"); };
  const cancelPicker = () => { setPendingReq(null); setSrc(null); navigate("/reporter/invoices"); };

  // Draft persisted or updated from the builder. When it's sent, open the read-only modal on it.
  const onSubmit = (inv, opts) => {
    if (opts.editing) store.updateInvoice(inv.id, inv); else store.addInvoice(inv);
    setSrc(null); setPendingReq(null); navigate("/reporter/invoices");
    if (opts.send) setModalInv({ ...inv });
  };
  // Clicking a row: drafts open the builder (editable); sent/paid open the read-only modal.
  const openInvoice = (i) => { if (i.status === "draft") { setSrc({ invoice: i }); navigate("/reporter/invoices/build"); } else setModalInv(i); };

  if (view === "template") return <TemplatePicker prefill={pickerPrefill} onCancel={cancelPicker} onPick={pickTemplate} />;
  if (view === "build") return <InvoiceBuilder src={src} onCancel={() => window.history.back()} onSubmit={onSubmit} />;

  return (
    <div>
      {requests.length > 0 && (
        <div className="ds-card flat" style={{ marginBottom: 18, background: "var(--brand-soft)", borderColor: "var(--brand-pale)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}><Icon name="invoice" size={18} style={{ color: "var(--brand-dark)" }} /><h3 style={{ fontSize: 22 }}>Invoice requests from firms</h3></div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {requests.map((q) => (
              <div key={q.id} style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", background: "var(--bg)", border: "1px solid var(--rule)", borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ flex: 1, minWidth: 200 }}>
                  <div style={{ fontWeight: 600, color: "var(--ink)" }}>{q.firmName}{q.amount ? " · $" + q.amount.toLocaleString(undefined, { minimumFractionDigits: 2 }) : ""}</div>
                  <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{q.matter ? q.matter + " – " : ""}{q.desc}</div>
                </div>
                <button className="btn btn-primary" onClick={() => acceptRequest(q)}><Icon name="plus" size={15} /> Create invoice</button>
              </div>
            ))}
          </div>
        </div>
      )}
      <div className="ds-card" style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ overflowX: "auto" }}>
          <table className="ds-table">
            <thead><tr><th>Invoice</th><th>Client / matter</th><th>Date</th><th>Due</th><th>Status</th><th style={{ textAlign: "right" }}>Amount</th></tr></thead>
            <tbody>
              {invoices.map((i) => (
                <tr key={i.id} style={{ cursor: "pointer" }} onClick={() => openInvoice(i)}>
                  <td style={{ fontWeight: 600, color: "var(--ink)" }}>{i.id}</td>
                  <td><div style={{ color: "var(--ink)" }}>{i.client}</div><div style={{ fontSize: 12.5, color: "var(--muted)" }}>{i.matter}</div></td>
                  <td>{i.date}</td><td>{i.due}</td><td><InvStatus status={i.status} /></td>
                  <td style={{ textAlign: "right", fontWeight: 600, color: "var(--ink)" }}>${i.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {modalInv && <InvoiceModal inv={store.invoices.find((i) => i.id === modalInv.id) || modalInv} viewer="reporter" onClose={() => setModalInv(null)} />}
    </div>
  );
}

let INV_SEQ = 1045;
// The builder is the one place invoices are authored OR edited. `src` decides what it opens on:
//   { template }  – a fresh invoice from a starter template
//   { prefill }   – a firm's payment request, pre-filled and fully editable (see acceptRequest)
//   { invoice }   – an existing DRAFT, reopened to edit (finalized invoices never come here)
function InvoiceBuilder({ src, onCancel, onSubmit }) {
  const store = useStore();
  const me = useMemo(() => { const all = buildDirectory(); return all.find((x) => x.id === store.myCsr) || all.find((x) => x.claimed); }, [store.myCsr]);
  const editInv = src && src.invoice ? src.invoice : null;
  const prefill = src && src.prefill ? src.prefill : null;
  const template = src && src.template ? src.template : (editInv || prefill ? null : INVOICE_TEMPLATES[3]);
  const label = editInv ? "Editing " + editInv.id : prefill ? "From " + prefill.firmName + "'s request" : (template ? template.name : "Invoice");

  const [f, setF] = useState(
    editInv ? { client: editInv.client, matter: editInv.matter === "–" ? "" : (editInv.matter || ""), date: editInv.date || "2026-07-17", due: editInv.due || "", notes: editInv.notes || "" }
    : prefill ? { client: prefill.firmName || "", matter: prefill.matter || "", date: "2026-07-17", due: "", notes: "" }
    : { client: "", matter: "", date: "2026-07-17", due: "2026-07-31", notes: "" }
  );
  // For a fresh template invoice, pre-fill each line's Rate from the reporter's own saved rates
  // where the line maps to one (l.rateKey) and they've entered it – otherwise leave it blank.
  const fillFromProfile = (l) => {
    if (l.rate) return l.rate;
    if (l.rateKey && me && me.rates) { const n = parseRate(me.rates[l.rateKey]); if (n != null) return String(n); }
    return "";
  };
  const [lines, setLines] = useState(() => {
    if (editInv) return invoiceToLines(editInv);
    // A real (non-blank) template wins even when there's a request prefill - the reporter chose to itemize.
    if (template && template.id !== "blank" && template.lines) return template.lines.map((l) => ({ desc: l.desc, kind: l.kind || "unit", qty: l.qty, rate: fillFromProfile(l) }));
    // Blank template on a request (or a bare request): keep the firm's requested amount as one line.
    if (prefill) return [{ desc: prefill.desc || "", kind: "flat", qty: "1", rate: prefill.amount ? String(prefill.amount) : "" }];
    return ((template && template.lines) || [{ desc: "", kind: "unit", qty: "1", rate: "" }]).map((l) => ({ desc: l.desc, kind: l.kind || "unit", qty: l.qty, rate: fillFromProfile(l) }));
  });
  const didPrefill = useMemo(() => !editInv && !!template && template.id !== "blank" && (template.lines || []).some((l) => l.rateKey && me && me.rates && parseRate(me.rates[l.rateKey]) != null), []);
  const [preview, setPreview] = useState(false);
  const [sending, setSending] = useState(false);
  const [toast, setToast] = useState("");

  const setLine = (i, k, v) => setLines((xs) => xs.map((l, j) => j === i ? { ...l, [k]: v } : l));
  const addLine = () => setLines((xs) => [...xs, { desc: "", kind: "flat", qty: "1", rate: "" }]);
  const addAddon = (desc) => setLines((xs) => [...xs, { desc, kind: "flat", qty: "1", rate: "" }]);
  const removeLine = (i) => setLines((xs) => xs.length > 1 ? xs.filter((_, j) => j !== i) : xs);
  // Flip a line between a flat one-off fee and metered quantity × rate. Going metered, seed qty=1.
  const toggleKind = (i) => setLines((xs) => xs.map((l, j) => j === i ? { ...l, kind: l.kind === "flat" ? "unit" : "flat", qty: l.kind === "flat" && !(Number(l.qty) > 0) ? "1" : l.qty } : l));
  // Flat lines are a single fee (stored in `rate`, qty ignored); metered lines are qty × rate.
  const lineAmt = (l) => l.kind === "flat" ? (Number(l.rate) || 0) : (Number(l.qty) || 0) * (Number(l.rate) || 0);
  const total = lines.reduce((s, l) => s + lineAmt(l), 0);
  const valid = f.client && total > 0;
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  // Build the stored invoice object at a given status. Reuses the id when editing a draft.
  const build = (status, extra) => Object.assign({
    id: editInv ? editInv.id : ("INV-" + (++INV_SEQ)),
    client: f.client, matter: f.matter || "–",
    desc: lines[0] && lines[0].desc ? lines[0].desc : "Court reporting services",
    date: f.date, due: f.due, amount: total, status, notes: f.notes,
    lineItems: lines.filter((l) => l.desc || lineAmt(l) > 0).map((l) => l.kind === "flat"
      ? { desc: l.desc, flat: true, amount: Number(l.rate) || 0 }
      : { desc: l.desc, qty: Number(l.qty) || 0, rate: Number(l.rate) || 0 }),
  }, editInv && editInv.from ? { from: editInv.from } : {}, extra || {});

  const saveDraft = () => onSubmit(build("draft"), { editing: !!editInv, send: false });
  // Send: finalize, fetch a real payment link (falls back to a demo link), persist as sent, and
  // let the parent open the read-only modal on it.
  const sendInvoice = async () => {
    setSending(true);
    let payLink = "https://pay.deweysholes.com/i/" + (editInv ? editInv.id : "INV-" + (INV_SEQ + 1)).toLowerCase();
    const inv = build("sent");
    try {
      const resp = await fetch("api/pay/create-payment-link", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ invoiceId: inv.id, client: inv.client, amount: inv.amount, description: inv.desc, matter: inv.matter }),
      });
      if (resp.ok) { const d = await resp.json(); if (d && d.url) payLink = d.url; }
    } catch (e) { /* keep demo link */ }
    onSubmit(Object.assign(inv, { payLink }), { editing: !!editInv, send: true });
  };

  if (preview) return (
    <div style={{ maxWidth: 680 }}>
      <button onClick={() => setPreview(false)} style={backLink}><Icon name="arrow" size={15} style={{ transform: "rotate(180deg)" }} /> Back to edit</button>
      <div className="banner banner-info" style={{ marginBottom: 16 }}><Icon name="eye" size={18} style={{ flexShrink: 0 }} /><div>This is how {f.client || "the firm"} will see your invoice.</div></div>
      <InvoicePreviewCard me={me} f={f} lines={lines} total={total} />
      <div style={{ display: "flex", gap: 12, marginTop: 18, flexWrap: "wrap" }}>
        <button className="btn btn-primary" disabled={!valid || sending} style={{ opacity: valid && !sending ? 1 : 0.4 }} onClick={sendInvoice}><Icon name="mail" size={16} /> {sending ? "Sending…" : "Send invoice"}</button>
        <button className="btn btn-secondary" disabled={!valid} style={{ opacity: valid ? 1 : 0.4 }} onClick={saveDraft}>Save as draft</button>
        <button className="btn btn-secondary" onClick={() => setPreview(false)}>Back to edit</button>
      </div>
    </div>
  );

  return (
    <div style={{ maxWidth: 760 }}>
      <button onClick={onCancel} style={backLink}><Icon name="arrow" size={15} style={{ transform: "rotate(180deg)" }} /> Back to invoices</button>
      <div className="ds-card" style={{ display: "flex", flexDirection: "column", gap: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <h2 style={{ fontSize: 26 }}>{editInv ? "Edit invoice" : "New invoice"}</h2>
          <span className="pill pill-tag">{label}</span>
        </div>
        {prefill && <div className="ds-note" style={{ marginBottom: 0 }}><Icon name="info" size={15} style={{ flexShrink: 0, color: "var(--dim)" }} /><span>{prefill.firmName} asked you to bill them. We filled in what they sent – edit anything, add mileage or other fees, then send.</span></div>}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <div><label className="ds-label">Client / firm *</label><input className="ds-input" placeholder="Morgan & Reyes LLP" value={f.client} onChange={set("client")} /><div style={{ fontSize: 12, color: "var(--dim)", marginTop: 5, lineHeight: 1.45 }}>New to Dewey Sholes? They get a free account to view and pay, and you're saved to their firm.</div></div>
          <div><label className="ds-label">Matter reference</label><input className="ds-input" placeholder="Ramos v. Delta Freight (24CV01188)" value={f.matter} onChange={set("matter")} /></div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <div><label className="ds-label">Service date</label><input className="ds-input" type="date" value={f.date} onChange={set("date")} /></div>
          <div><label className="ds-label">Due date</label><input className="ds-input" type="date" value={f.due} onChange={set("due")} /></div>
        </div>

        {/* line items */}
        <div>
          <label className="ds-label">Line items</label>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ display: "grid", gridTemplateColumns: "46px 1fr 62px 80px 82px 26px", gap: 8, fontSize: 11, fontWeight: 700, color: "var(--dim)", textTransform: "uppercase", letterSpacing: ".03em", padding: "0 2px" }}>
              <span /><span>Description</span><span style={{ textAlign: "right" }}>Qty</span><span style={{ textAlign: "right" }}>Rate</span><span style={{ textAlign: "right" }}>Amount</span><span />
            </div>
            {lines.map((l, i) => {
              const flat = l.kind === "flat";
              return (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "46px 1fr 62px 80px 82px 26px", gap: 8, alignItems: "center" }}>
                  <button type="button" onClick={() => toggleKind(i)} title={flat ? "Flat one-off fee. Click for quantity × rate." : "Quantity × rate. Click for a flat fee."} style={{ fontSize: 9.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".02em", color: "var(--brand-dark)", background: "var(--brand-soft)", border: "1px solid var(--brand-pale)", borderRadius: 6, padding: "7px 0", cursor: "pointer" }}>{flat ? "Flat" : "Qty"}</button>
                  <input className="ds-input" style={{ padding: "9px 11px", fontSize: 13.5 }} placeholder="Description" value={l.desc} onChange={(e) => setLine(i, "desc", e.target.value)} />
                  {flat
                    ? <span style={{ gridColumn: "3 / 5", textAlign: "right", fontSize: 12, color: "var(--dim)", fontStyle: "italic" }}>Flat fee</span>

                        <input className="ds-input" style={{ padding: "9px 8px", fontSize: 13.5, textAlign: "right" }} type="number" placeholder="0" value={l.qty} onChange={(e) => setLine(i, "qty", e.target.value)} />

            {INVOICE_ADDONS.map((a) => <button key={a} type="button" className="chip-filter" onClick={() => addAddon(a)}><Icon name="plus" size={13} style={{ display: "inline", verticalAlign: "-2px", marginRight: 3 }} />{a}</button>)}
          </div>
        </div>

        <div className="ds-panel" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
          <button className="btn btn-primary" disabled={!valid || sending} style={{ opacity: valid && !sending ? 1 : 0.4 }} onClick={sendInvoice}><Icon name="mail" size={16} /> {sending ? "Sending…" : "Send invoice"}</button>
          <button className="btn btn-secondary" disabled={!valid} style={{ opacity: valid ? 1 : 0.4 }} onClick={saveDraft}>Save as draft</button>
          <button type="button" disabled={!valid} onClick={() => setPreview(true)} style={{ marginLeft: "auto", background: "none", border: "none", color: valid ? "var(--brand-dark)" : "var(--dim)", cursor: valid ? "pointer" : "default", fontSize: 14, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 5, padding: "6px 4px" }}><Icon name="eye" size={15} /> Preview</button>
        </div>
      </div>
      <Toast msg={toast} onClose={() => setToast("")} />
    </div>
  );
}

// The invoice document itself – the real issued page. Shared by the builder preview and the
// read-only InvoiceModal so both look identical, and it's what prints (see .invoice-print in CSS).
function InvoiceDocument({ reporterName, reporterSub, invoiceId, client, matter, date, due, items, total, paid, method, paidAt, showPayBar }) {
  const rows = (items || []).filter((l) => l.desc || (l.flat ? (Number(l.amount) || 0) > 0 : (Number(l.qty) || 0) * (Number(l.rate) || 0) > 0));
  return (
    <div className="ds-card" style={{ padding: 0, overflow: "hidden" }}>
      <div style={{ padding: "26px 28px", borderBottom: "1px solid var(--rule)", display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 14 }}>
        <div>
          <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 22, color: "var(--ink)" }}>{reporterName || "Your name"}</div>
          {reporterSub ? <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{reporterSub}</div> : null}
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--brand)", textTransform: "uppercase", letterSpacing: ".08em" }}>Invoice{invoiceId ? " · " + invoiceId : ""}</div>
          <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 4 }}>Issued {date || "–"}</div>
          <div style={{ fontSize: 13, color: "var(--muted)" }}>Due {due || "–"}</div>
          {/* PAID stamp is deliberately GREEN - the universal paid convention (Aud, 2026-08-03).
              An intentional exception to the "never green" palette rule; see docs/palette.md. */}
          {paid ? <div style={{ display: "inline-block", marginTop: 8, border: "2px solid #16A34A", color: "#15803D", borderRadius: 7, padding: "3px 11px", fontSize: 13, fontWeight: 800, letterSpacing: ".1em", transform: "rotate(-3deg)" }}>PAID</div> : null}
        </div>
      </div>
      <div style={{ padding: "20px 28px", borderBottom: "1px solid var(--rule)" }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "var(--brand)", textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 4 }}>Bill to</div>
        <div style={{ fontSize: 15, color: "var(--ink)" }}>{client || "–"}</div>
        {matter && matter !== "–" ? <div style={{ fontSize: 13.5, color: "var(--muted)", marginTop: 2 }}>Matter: {matter}</div> : null}
      </div>
      <div style={{ overflowX: "auto" }}>
        <table className="ds-table">
          <thead><tr><th>Description</th><th style={{ textAlign: "right" }}>Qty</th><th style={{ textAlign: "right" }}>Rate</th><th style={{ textAlign: "right" }}>Amount</th></tr></thead>
          <tbody>{rows.length ? rows.map((l, i) => {
            const flat = l.flat === true;
            const amt = flat ? (Number(l.amount) || 0) : (Number(l.qty) || 0) * (Number(l.rate) || 0);
            return <tr key={i}><td style={{ color: "var(--ink)" }}>{l.desc || "–"}</td><td style={{ textAlign: "right", color: "var(--muted)" }}>{flat ? "" : (Number(l.qty) || 0)}</td><td style={{ textAlign: "right", color: "var(--muted)" }}>{flat ? "" : "$" + (Number(l.rate) || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td><td style={{ textAlign: "right", fontWeight: 600, color: "var(--ink)" }}>${amt.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>;
          }) : <tr><td colSpan={4} style={{ color: "var(--muted)" }}>–</td></tr>}</tbody>
        </table>
      </div>
      <div style={{ padding: "18px 28px", display: "flex", justifyContent: "space-between", alignItems: "center", background: "var(--bg-soft)", borderTop: "1px solid var(--rule)" }}>
        <span style={{ color: "var(--muted)", fontSize: 14 }}>{paid ? "Total paid" : "Total due"}</span>
        <span style={{ fontFamily: "'Instrument Serif', serif", fontSize: 28, color: "var(--ink)" }}>${(total || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
      </div>
      {paid ? (
        <div style={{ padding: "16px 28px 22px" }}>
          <div className="banner banner-ok" style={{ marginBottom: 0 }}>
            <Icon name="check" size={18} style={{ color: "var(--brand-dark)", flexShrink: 0 }} />
            <div><strong style={{ color: "var(--ink)", fontWeight: 600 }}>Paid in full.</strong>{method ? " By " + method : ""}{paidAt ? " on " + paidAt : ""} · via Stripe, powered by Dewey Sholes.</div>
          </div>
        </div>
      ) : showPayBar ? (
        <div style={{ padding: "18px 28px 24px" }}>
          <div className="btn btn-primary" style={{ width: "100%", justifyContent: "center", cursor: "default", pointerEvents: "none" }}><Icon name="lock" size={15} /> Pay by card or ACH</div>
          <div style={{ fontSize: 11.5, color: "var(--dim)", textAlign: "center", marginTop: 10 }}>Secure payment via Stripe · powered by Dewey Sholes</div>
        </div>
      ) : null}
    </div>

}

// The invoice as the firm receives it (builder preview) – delegates to the shared document.

  const items = lines.map((l) => l.kind === "flat" ? { desc: l.desc, flat: true, amount: Number(l.rate) || 0 } : { desc: l.desc, qty: l.qty, rate: l.rate });
