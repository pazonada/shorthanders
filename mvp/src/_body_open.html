<style>

  .rep-card {

    cursor: pointer; text-align: left;

  .pill-rush { background: var(--ochre-soft); color: var(--ochre-deep); }
  .pill-new { background: var(--accent-soft); color: var(--accent); }

  .ds-input:focus::placeholder, .form-input:focus::placeholder, .msg-search:focus::placeholder, textarea:focus::placeholder { color: transparent; }
  .ds-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .ds-card {

  .dir-section-label { font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin: 4px 0 12px; }
