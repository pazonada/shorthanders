  }

  /* ═══ HERO (hybrid two-column with order card) ═══ */
  .hero { padding: 80px 0 0; position: relative; overflow: hidden; }
  .hero-glow {
    position: absolute;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 1100px; height: 700px;
    background: radial-gradient(ellipse at center top, rgba(67,97,238,0.10) 0%, transparent 65%);
    z-index: 0; pointer-events: none;
  }
  .hero-card-area { position: relative; }
  .hero-card-area .order-card { position: relative; z-index: 1; }
  .hero-shorthand-bg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 168%; max-width: 970px;
    height: auto;
    opacity: 0.15;
    pointer-events: none; z-index: 0; user-select: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 8%, #000 92%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 8%, #000 92%, transparent 100%);
  }
  @media (max-width: 1024px) {
    .hero-shorthand-bg { width: 129%; max-width: 713px; opacity: 0.12; }
  }
  @media (max-width: 720px) { .hero-shorthand-bg { opacity: 0.10; } }
  .hero-grid {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    gap: 72px; align-items: center;
  }
  @media (max-width: 1024px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }
  .headline {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: clamp(52px, 7vw, 96px);
    line-height: 1.02; letter-spacing: -0.025em;
    color: var(--ink);
  }
  .headline em { font-style: italic; color: var(--brand); }
  .hero .hero-actions { margin-top: 36px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; flex-direction: row; justify-content: flex-start; }

  /* ═══ ORDER CARD ═══ */
  .order-card {
    background: #FFF;
    border: 1px solid var(--rule);
    border-radius: 20px;
    box-shadow: 0 30px 80px -28px rgba(15,23,42,0.18);
    overflow: hidden;
    transform: rotate(-0.4deg);
  }
  .order-card-head {
    background: var(--bg-soft);
    border-bottom: 1px solid var(--rule);
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
  }
  .order-card-head .pill {
    background: var(--brand-soft); color: var(--brand);
    padding: 4px 12px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
  }
  .order-card-body { padding: 28px; }
  .order-card-tabs { display: flex; gap: 6px; margin-bottom: 22px; }
  .order-card-tab {
    padding: 8px 16px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--rule); background: var(--bg); color: var(--muted);
  }
  .order-card-tab.active { background: var(--brand-soft); border-color: var(--brand-pale); color: var(--brand); }
  .order-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 12px; }
  .order-fields.three { grid-template-columns: 1fr 1fr 1fr; }
  .order-field { background: var(--bg-soft); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; }
  .order-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--dim); display: block; margin-bottom: 6px;
  }
  .order-field .v { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
  .order-field.brand { background: var(--brand-soft); border-color: var(--brand-pale); }
  .order-field.brand .v { color: var(--brand-dark); }
  .order-card-foot {
    margin-top: 18px; padding-top: 16px;
    border-top: 1px dashed var(--rule);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .order-card-price { font-family: 'Instrument Serif', serif; font-size: 32px; color: var(--ink); }
  .order-card-price span { font-size: 14px; color: var(--muted); font-family: 'Inter', sans-serif; }
  .order-card-cta {
    background: var(--ink); color: #FFFFFF;
    padding: 10px 18px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    text-decoration: none; transition: background 0.15s ease;
  }
  .order-card-cta:hover { background: var(--brand); color: #FFFFFF; }

  /* ═══ SHORTHAND TRANSITION ═══ */
  .shorthand-transition { max-width: 1280px; margin: 0 auto; padding: 0 32px; text-align: center; }
  .shorthand-transition img {
    max-width: 100%; width: 100%; height: auto;
    opacity: 0.75; mix-blend-mode: multiply;
    user-select: none; pointer-events: none; display: block;
  }
  @media (max-width: 720px) {
    .shorthand-transition { padding: 0 20px; }
    .shorthand-transition img { opacity: 0.6; }
  }

  /* ═══ SECTION PRIMITIVES (hybrid) – scoped to .section.hybrid ═══ */
  .section.hybrid { padding: 24px 0 56px; position: relative; background: none; }
  @media (max-width: 720px) { .section.hybrid { padding: 16px 0 40px; } }
  .section.hybrid .section-header { max-width: 760px; margin: 0 auto 40px; text-align: center; }
  .section-eyebrow {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--brand);
    margin-bottom: 16px;
  }
  .section-title {
    font-family: 'Instrument Serif', serif;
    font-weight: 400; font-size: clamp(40px, 5.4vw, 68px);
    line-height: 1.05; letter-spacing: -0.025em; color: var(--ink);
  }
  .section-title em { font-style: italic; color: var(--brand); }
  .section-lede {
    margin-top: 18px;
    font-size: 18px; line-height: 1.65;
    color: var(--ink-soft);
    max-width: 580px; margin-left: auto; margin-right: auto;
    text-wrap: pretty;
  }

  /* ═══ HOW IT WORKS ═══ */
  .tab-toggle { display: flex; justify-content: center; margin-bottom: 48px; }
  .tab-toggle-inner {
    display: inline-flex; background: var(--bg-soft);
    border: 1px solid var(--rule); border-radius: 14px;
    padding: 6px; gap: 4px;
    box-shadow: 0 2px 8px -4px rgba(15,23,42,0.08);
  }
  .tab-btn {
    padding: 14px 32px; border-radius: 10px;
    font-size: 16px; font-weight: 600;
    border: none; background: transparent;
    color: var(--ink-soft); cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { background: var(--ink); color: #FFFFFF; box-shadow: 0 6px 16px -6px rgba(15,23,42,0.32); }
  .tab-btn.active:hover { color: #FFFFFF; }
  @media (max-width: 540px) { .tab-toggle-inner { width: 100%; } .tab-btn { flex: 1; padding: 12px 16px; font-size: 14px; } }
  .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  @media (max-width: 860px) { .steps-grid { grid-template-columns: 1fr; } }
  .step-card {
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: 16px; padding: 32px 28px;
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .step-card:hover { border-color: var(--brand-pale); box-shadow: 0 12px 32px -16px rgba(37,99,235,0.15); }
  .step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .step-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .step-icon svg { width: 20px; height: 20px; }
  .step-num { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 28px; color: var(--brand); line-height: 0.9; }
  .step-card h3 {
    font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 26px;
    line-height: 1.18; color: var(--ink); letter-spacing: -0.015em;
  }
  .step-card p { font-size: 15px; color: var(--ink-soft); line-height: 1.65; }
  .seemore { display: flex; justify-content: center; margin-top: 36px; }

  /* SRL callout */
  .srl-callout {
    max-width: 760px; margin: 40px auto 0;
    padding: 18px 22px;
    background: var(--cream);
    border: 1px solid var(--cream-deep);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .srl-callout-l { display: flex; align-items: center; gap: 12px; flex: 1 1 320px; min-width: 0; }
  .srl-callout-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--ochre-soft); color: var(--ochre-deep);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .srl-callout-icon svg { width: 16px; height: 16px; }
  .srl-callout-text { font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
  .srl-callout-text strong { font-weight: 700; color: var(--ink); }
  .srl-cta {
    white-space: nowrap; flex-shrink: 0;
    background: var(--bg); color: var(--ink-soft);
    border: 1px solid var(--rule);
    padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .srl-cta:hover { border-color: var(--rule-strong); color: var(--ink); }

  /* ═══ USE CASES ═══ */
  .usecases-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
  @media (max-width: 1024px) { .usecases-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) { .usecases-grid { grid-template-columns: 1fr; } }
  .usecase {
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: 20px; padding: 44px;
    position: relative; display: flex; flex-direction: column;
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .usecase:hover { border-color: var(--brand-pale); transform: translateY(-2px); }
  @media (max-width: 720px) { .usecase { padding: 28px; } }
  .usecase-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--brand); }
  .usecase-bar.ochre { background: var(--ochre); }
  .usecase-bar.sage { background: var(--sage); }
  .usecase-icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
  }
  .usecase-icon.ochre { background: var(--ochre-soft); color: var(--ochre-deep); }
  .usecase-icon.sage { background: var(--sage-soft); color: var(--sage-deep); }
  .usecase-icon svg { width: 24px; height: 24px; }
  .usecase-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--brand);
    margin-bottom: 8px;
  }
  .usecase-label.ochre { color: var(--ochre-deep); }
  .usecase-label.sage { color: var(--sage-deep); }
  .usecase h3 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 30px; line-height: 1.1; color: var(--ink);
    margin-bottom: 12px; letter-spacing: -0.02em;
  }
  .usecase > p { font-size: 15px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 24px; }
  .usecase-list { list-style: none; margin-bottom: 20px; }
  .usecase-list li { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; font-size: 14px; color: var(--ink-soft); line-height: 1.55; }
  .usecase-list li svg { flex: 0 0 16px; width: 16px; height: 16px; margin-top: 3px; color: var(--brand); }
  .usecase.ochre .usecase-list li svg { color: var(--ochre-deep); }
  .usecase.sage .usecase-list li svg { color: var(--sage-deep); }
  .usecase-pricecallout {
    margin-top: 16px; padding: 12px 14px;
    background: var(--brand-soft); border-radius: 10px;
    font-size: 13px; color: var(--brand-dark); line-height: 1.55;
  }
  .usecase-pricecallout strong { font-weight: 700; }

  /* ═══ COMPLIANCE ═══ */
  .compliance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  @media (max-width: 960px) { .compliance-grid { grid-template-columns: 1fr; gap: 48px; } }
  .compliance-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--sage-deep);
    margin-bottom: 14px;
  }
  .section.compliance h2 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(36px, 5vw, 60px);
    line-height: 1.05; color: var(--ink); letter-spacing: -0.025em;
  }
  .section.compliance h2 em { font-style: italic; color: var(--brand); }
  .compliance-text { margin-top: 22px; font-size: 17px; line-height: 1.7; color: var(--ink-soft); }
  .compliance-features { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .compliance-features > div { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--ink-soft); line-height: 1.55; }
  .compliance-features svg { width: 18px; height: 18px; flex: 0 0 18px; color: var(--brand); margin-top: 2px; }
  .compliance-card {
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: 18px; padding: 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .compliance-item { display: flex; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .compliance-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .compliance-check {
    flex: 0 0 28px; width: 28px; height: 28px;
    border-radius: 8px; background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .compliance-check svg { width: 16px; height: 16px; }
  .compliance-item strong { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; color: var(--ink); display: block; }
  .compliance-item .sub { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 3px; }

  /* ═══ FEE WAIVER / DARK CALLOUT ═══ */
  .fee-waiver {
    max-width: 1080px; margin: 24px auto 0;
    background: var(--ink); color: #FFFFFF;
    border-radius: 18px;
    padding: 22px 32px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  @media (max-width: 720px) { .fee-waiver { padding: 20px 24px; } }
  .fee-waiver p { font-weight: 600; font-size: 15px; margin: 0; }
  .fee-waiver .sub { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 400; margin-top: 4px; max-width: 540px; line-height: 1.55; }
  .fee-waiver a {
    color: var(--ink); background: #FFFFFF;
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    text-decoration: none; white-space: nowrap;
    transition: background 0.15s ease;
  }
  .fee-waiver a:hover { background: var(--periwinkle); }

  /* ═══════════════════════════════════════════════════════════════
     APP CHROME – hybrid overrides that propagate to every app screen
     (signup flows, order flow, dashboard, messages, transcript, etc.)
     ═══════════════════════════════════════════════════════════════ */

  /* App nav */
  .app-nav {
    position: sticky;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--rule);
    box-shadow: none;
  }
  .app-nav-inner { height: 72px; }
  .app-nav-link {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 8px 16px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .app-nav-link:hover { background: var(--bg-soft); color: var(--ink); }
  .app-nav-link.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .app-nav-avatar {
    background: var(--ink);
    color: #FFFFFF;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  /* Page chrome */
  .page { padding-top: 56px; padding-bottom: 80px; background: var(--bg); }
  .page-header h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: clamp(34px, 4vw, 48px);
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .page-header h1 em { font-style: italic; color: var(--brand); }
  .page-header p {
    font-size: 16px;
    color: var(--ink-soft);
    margin-top: 8px;
    line-height: 1.55;
  }

  /* Card primitive */
  .card {
    background: var(--bg) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 16px !important;
    box-shadow: none !important;
  }

  /* Form inputs */
  .form-input {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 14px;
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .form-input::placeholder { color: var(--dim); }
  .form-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* Form file dropzone */
  .form-file {
    border: 1px dashed var(--rule-strong);
    background: var(--bg-soft);
    border-radius: 14px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .form-file:hover { border-color: var(--brand-pale); background: var(--brand-soft); }

  /* Common section headlines inside app views */
  .page h2,
  .page-content h2 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    letter-spacing: -0.018em;
    color: var(--ink);
  }
  .page h2 em { font-style: italic; color: var(--brand); }

  /* ═══ REPORTER DIRECTORY CARD HOVER ═══ */
  .reporter-card:hover { border-color: var(--brand-pale) !important; box-shadow: 0 12px 32px -18px rgba(37,99,235,0.18); }

  /* ═══ PRICING SLIDE-UP ROUTE ═══ */
  @keyframes pricingSlideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .pricing-slideup { animation: pricingSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .section.hybrid.pricing { background: var(--periwinkle-soft); border-top: 1px solid var(--rule-cream); border-bottom: 1px solid var(--rule-cream); padding-top: 80px; padding-bottom: 80px; }

  /* ═══ PRICING CARDS (used by #/pricing) ═══ */
  .pricing-cards-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; max-width: 1080px; margin: 0 auto;
  }
  @media (max-width: 860px) { .pricing-cards-row { grid-template-columns: 1fr; } }
  .pricing-card {
    background: var(--bg);
