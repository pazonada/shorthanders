function TaskModal({ task, isNew, onSave, onDelete, onClose }) {
  const [form, setForm] = React.useState({
    title: task.title || "", description: task.description || "", column: task.column || "todo",
    priority: task.priority || "medium", assignee: Array.isArray(task.assignee) ? task.assignee : task.assignee ? [task.assignee] : [], category: task.category || "product",
    dueDate: task.dueDate || "", notes: task.notes || "", tags: task.tags || [],
  });
  const up = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.title.trim()) return;
    onSave(isNew ? form : { ...task, ...form });
  };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal kanban-modal" onClick={e => e.stopPropagation()}>
        <h2 style={{marginBottom: 20}}>{isNew ? "New task" : "Edit task"}</h2>
        <form onSubmit={handleSubmit}>
          <div className="form-group">
            <label className="form-label">Title</label>
            <input className="form-input" value={form.title} onChange={e => up("title", e.target.value)} placeholder="Task title..." autoFocus />
          </div>
          <div className="form-group">
            <label className="form-label">Description</label>
            <textarea className="form-input" value={form.description} onChange={e => up("description", e.target.value)} placeholder="Brief description..." />
          </div>
          <div className="form-row">
            <div className="form-group" style={{flex:1}}>
              <label className="form-label">Status</label>
              <select className="form-input" value={form.column} onChange={e => up("column", e.target.value)}>
                {KANBAN_COLUMNS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
            </div>
            <div className="form-group" style={{flex:1}}>
              <label className="form-label">Priority</label>
              <select className="form-input" value={form.priority} onChange={e => up("priority", e.target.value)}>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group" style={{flex:1}}>
              <label className="form-label">Assignee(s)</label>
              <div className="kanban-assignee-picker">
                {["Aud","Rosie","TBD"].map(name => (
                  <button key={name} type="button" className={"kanban-assignee-toggle" + (form.assignee.includes(name) ? " active" : "")}
                    onClick={() => up("assignee", form.assignee.includes(name) ? form.assignee.filter(a => a !== name) : [...form.assignee, name])}>{name}</button>
                ))}
              </div>
            </div>
            <div className="form-group" style={{flex:1}}>
              <label className="form-label">Category</label>
              <select className="form-input" value={form.category} onChange={e => up("category", e.target.value)}>
                <option value="legal">Legal</option>
                <option value="financial">Financial</option>
                <option value="product">Product</option>
                <option value="marketing">Marketing</option>
                <option value="operations">Operations</option>
                <option value="research">Research</option>
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group" style={{flex:1}}>
              <label className="form-label">Due date</label>
              <input className="form-input" type="date" value={form.dueDate} onChange={e => up("dueDate", e.target.value)} />
            </div>
            <div className="form-group" style={{flex:1}}>
              <label className="form-label">Tags</label>
              <div className="kanban-assignee-picker">
                {["P0","P1","P2","decision","legal"].map(tag => (
                  <button key={tag} type="button" className={"kanban-assignee-toggle" + (form.tags.includes(tag) ? " active" : "")}
                    onClick={() => up("tags", form.tags.includes(tag) ? form.tags.filter(t => t !== tag) : [...form.tags, tag])}>{tag}</button>
                ))}
              </div>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Notes</label>
            <textarea className="form-input" value={form.notes} onChange={e => up("notes", e.target.value)} placeholder="Additional notes..." />
          </div>
          <div className="kanban-modal-actions">
            <div>{onDelete && <button type="button" className="btn btn-sm" style={{background:"#FEE2E2",color:"#DC2626",border:"1px solid #FECACA"}} onClick={onDelete}>Delete task</button>}</div>
            <div style={{display:"flex",gap:8}}>
              <button type="button" className="btn btn-secondary btn-sm" onClick={onClose}>Cancel</button>
              <button type="submit" className="btn btn-primary btn-sm">{isNew ? "Create task" : "Save changes"}</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  );
}

function KanbanBoard() {
  const STORAGE_KEY = "dewey_kanban_tasks";
  const migrateAssignee = (a) => Array.isArray(a) ? a : a === "Both" ? ["Aud","Rosie"] : a === "Lawyer" ? ["TBD"] : a ? [a] : [];
  const loadTasks = () => { try { const s = localStorage.getItem(STORAGE_KEY); if (!s) return DEFAULT_KANBAN_TASKS; const t = JSON.parse(s); return t.map(tk => ({ ...tk, assignee: migrateAssignee(tk.assignee) })); } catch(e) { return DEFAULT_KANBAN_TASKS; } };

  const [tasks, setTasks] = React.useState(loadTasks);
  const [editingTask, setEditingTask] = React.useState(null);
  const [isCreating, setIsCreating] = React.useState(false);
  const [createColumn, setCreateColumn] = React.useState("todo");
  const [draggedId, setDraggedId] = React.useState(null);
  const [dragOverCol, setDragOverCol] = React.useState(null);
  const [search, setSearch] = React.useState("");
  const [fCat, setFCat] = React.useState("all");
  const [fAssign, setFAssign] = React.useState("all");
  const [fPri, setFPri] = React.useState("all");

  React.useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }, [tasks]);

  const addTask = (data) => { setTasks(prev => [...prev, { ...data, id: "t" + Date.now(), createdAt: new Date().toISOString().split("T")[0] }]); setIsCreating(false); };
  const updateTask = (data) => { setTasks(prev => prev.map(t => t.id === data.id ? { ...t, ...data } : t)); setEditingTask(null); };
  const deleteTask = (id) => { setTasks(prev => prev.filter(t => t.id !== id)); setEditingTask(null); };
  const moveTask = (id, col) => { setTasks(prev => prev.map(t => t.id === id ? { ...t, column: col } : t)); };

  const handleDragStart = (e, id) => { setDraggedId(id); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", id); requestAnimationFrame(() => { const el = document.getElementById("kb-" + id); if (el) el.classList.add("dragging"); }); };
  const handleDragEnd = () => { if (draggedId) { const el = document.getElementById("kb-" + draggedId); if (el) el.classList.remove("dragging"); } setDraggedId(null); setDragOverCol(null); };
  const handleDragOver = (e, colId) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; setDragOverCol(colId); };
  const handleDragLeave = (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverCol(null); };
  const handleDrop = (e, colId) => { e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id && colId) moveTask(id, colId); setDragOverCol(null); setDraggedId(null); };

  const handleReset = () => { if (confirm("Reset board to default tasks? This cannot be undone.")) { setTasks(DEFAULT_KANBAN_TASKS); localStorage.removeItem(STORAGE_KEY); } };

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "dewey-kanban-" + new Date().toISOString().split("T")[0] + ".json"; a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = () => {
    const input = document.createElement("input"); input.type = "file"; input.accept = ".json";
    input.onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!Array.isArray(data) || !data[0]?.title) { alert("Invalid board file."); return; }
          if (confirm("Replace current board with imported data? This cannot be undone.")) {
            setTasks(data.map(t => ({ ...t, assignee: migrateAssignee(t.assignee) })));
          }
        } catch { alert("Could not parse file."); }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const filtered = tasks.filter(t => {
    if (fCat !== "all" && t.category !== fCat) return false;
    if (fAssign !== "all" && !(Array.isArray(t.assignee) ? t.assignee : [t.assignee]).includes(fAssign)) return false;
    if (fPri !== "all" && t.priority !== fPri) return false;
    if (search) { const q = search.toLowerCase(); return t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || (t.notes || "").toLowerCase().includes(q); }
    return true;
  });

  return (
    <div>
      <AppNav variant="buyer" activeTab="" />
      <div className="page page-enter">
        <div className="container" style={{maxWidth: 1440}}>
          <div className="page-header">
            <div>
              <h1 style={{fontSize: 28}}>Project board</h1>
              <p style={{color: "#64748B", marginTop: 4}}>Track Dewey Sholes tasks across all workstreams.</p>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn btn-secondary btn-sm" onClick={handleExport} style={{gap: 6}}><Icon name="download" size={14} /> Export</button>
              <button className="btn btn-secondary btn-sm" onClick={handleImport} style={{gap: 6}}><Icon name="upload" size={14} /> Import</button>
              <button className="btn btn-secondary btn-sm" onClick={handleReset} style={{gap: 6}}><Icon name="x" size={14} /> Reset</button>
            </div>
          </div>

          <div className="kanban-stats">
            {KANBAN_COLUMNS.map(col => (
              <div className="kanban-stat" key={col.id}>
                <span className="kanban-stat-num" style={{color: col.color}}>{filtered.filter(t => t.column === col.id).length}</span>
                {col.label}
              </div>
            ))}
          </div>

          <div className="filter-bar" style={{marginBottom: 16}}>
            <input className="filter-input" placeholder="Search tasks..." value={search} onChange={e => setSearch(e.target.value)} style={{minWidth: 180}} />
            <select className="filter-select" value={fCat} onChange={e => setFCat(e.target.value)}>
              <option value="all">All categories</option>
              <option value="legal">Legal</option><option value="financial">Financial</option><option value="product">Product</option>
              <option value="marketing">Marketing</option><option value="operations">Operations</option><option value="research">Research</option>
            </select>
            <select className="filter-select" value={fAssign} onChange={e => setFAssign(e.target.value)}>
              <option value="all">All assignees</option>
              <option value="Aud">Aud</option><option value="Rosie">Rosie</option><option value="TBD">TBD</option>
            </select>
            <select className="filter-select" value={fPri} onChange={e => setFPri(e.target.value)}>
              <option value="all">All priorities</option>
              <option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
            </select>
          </div>

          <div className="kanban-board">
            {KANBAN_COLUMNS.map(col => {
              const colTasks = filtered.filter(t => t.column === col.id);
              const isOver = dragOverCol === col.id && draggedId;
              return (
                <div className="kanban-column" key={col.id}>
                  <div className="kanban-col-header">
                    <span style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{width:8,height:8,borderRadius:"50%",background:col.color}} />
                      {col.label}
                    </span>
                    <span className="kanban-col-count">{colTasks.length}</span>
                  </div>
                  <div className={"kanban-col-body" + (isOver ? " kanban-drop-zone" : "")}
                    onDragOver={e => handleDragOver(e, col.id)} onDragLeave={handleDragLeave} onDrop={e => handleDrop(e, col.id)}>
                    {colTasks.map(task => (
                      <div key={task.id} id={"kb-" + task.id} className="kanban-card" draggable="true"
                        onDragStart={e => handleDragStart(e, task.id)} onDragEnd={handleDragEnd}
                        onClick={() => setEditingTask(task)}>
                        <div className={"kanban-priority " + task.priority} />
                        <div className="kanban-card-actions">
                          <button className="kanban-card-btn delete" onClick={e => { e.stopPropagation(); deleteTask(task.id); }} title="Delete">
                            <Icon name="x" size={12} />
                          </button>
                        </div>
                        <div className="kanban-card-title">{task.title}</div>
                        {task.description && <div className="kanban-card-desc">{task.description}</div>}
                        <div className="kanban-card-meta">
                          <span className={"kanban-badge kanban-badge-" + task.category}>{task.category}</span>
                          {(task.tags || []).map(tag => <span key={tag} className={"kanban-tag kanban-tag-" + tag.toLowerCase().replace(/\s+/g, "")}>{tag}</span>)}
                          {(Array.isArray(task.assignee) ? task.assignee : task.assignee ? [task.assignee] : []).map(a => <span key={a} className="kanban-assignee">{a}</span>)}
                          {task.dueDate && <span className="kanban-assignee" style={{color:"#DC2626"}}>{task.dueDate}</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                  <button className="kanban-add-btn" onClick={() => { setCreateColumn(col.id); setIsCreating(true); setEditingTask(null); }}>+ Add task</button>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {(editingTask || isCreating) && (
        <TaskModal
          key={isCreating ? "new-" + createColumn : editingTask.id}
          task={isCreating ? { title:"", description:"", column: createColumn, priority:"medium", assignee:[], category:"product", dueDate:"", notes:"" } : editingTask}
          isNew={isCreating}
          onSave={isCreating ? addTask : updateTask}
          onDelete={!isCreating ? () => deleteTask(editingTask.id) : null}
          onClose={() => { setEditingTask(null); setIsCreating(false); }}
        />
      )}
    </div>
  );
}

function ReporterDirectory() {
  const [search, setSearch] = useState("");
  const [county, setCounty] = useState("all");
  const [specialty, setSpecialty] = useState("all");
  const [sortBy, setSortBy] = useState("rating");
  const [favorites, setFavorites] = useState(["rep-1", "rep-3"]);
  const [showFavOnly, setShowFavOnly] = useState(false);
  const { toasts, addToast, removeToast } = useToasts();

  const allCounties = [...new Set(MOCK_REPORTERS.flatMap(r => r.counties))].sort();
  const allSpecialties = [...new Set(MOCK_REPORTERS.flatMap(r => r.specialties))].sort();

  const toggleFav = (id) => {
    setFavorites(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
    const r = MOCK_REPORTERS.find(r => r.id === id);
    if (r) addToast(favorites.includes(id) ? "Removed from favorites" : "Added to favorites", r.name, favorites.includes(id) ? "info" : "success");
  };

  let filtered = MOCK_REPORTERS.filter(r => {
    if (search && !r.name.toLowerCase().includes(search.toLowerCase()) && !r.csrNumber.includes(search)) return false;
    if (county !== "all" && !r.counties.includes(county)) return false;
    if (specialty !== "all" && !r.specialties.includes(specialty)) return false;
    if (showFavOnly && !favorites.includes(r.id)) return false;
    return true;
  });

  if (sortBy === "rating") filtered.sort((a, b) => b.rating - a.rating);
  else if (sortBy === "jobs") filtered.sort((a, b) => b.stats.jobsCompleted - a.stats.jobsCompleted);
  else if (sortBy === "turnaround") filtered.sort((a, b) => parseFloat(a.stats.avgTurnaround) - parseFloat(b.stats.avgTurnaround));

  const dayLabels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  return (
    <div className="page page-enter">
      <div className="container" style={{maxWidth: 1100, padding: "32px 20px"}}>
        <div className="page-header" style={{marginBottom: 24}}>
          <div>
            <h1 style={{fontSize: 24, fontWeight: 700}}>Find a reporter</h1>
            <p style={{color: "#64748B", marginTop: 4}}>Browse verified court reporters across California</p>
          </div>
        </div>

        {/* Filters */}
        <div className="card" style={{padding: 16, marginBottom: 24}}>
          <div style={{display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center"}}>
            <div style={{flex: "1 1 200px", position: "relative"}}>
              <Icon name="search" size={16} style={{position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#94A3B8"}} />
              <input className="form-input" placeholder="Search by name or CSR #" value={search} onChange={e => setSearch(e.target.value)} style={{paddingLeft: 36}} />
            </div>
            <select className="form-input form-select" value={county} onChange={e => setCounty(e.target.value)} style={{flex: "0 1 180px"}}>
              <option value="all">All counties</option>
              {allCounties.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select className="form-input form-select" value={specialty} onChange={e => setSpecialty(e.target.value)} style={{flex: "0 1 180px"}}>
              <option value="all">All specialties</option>
              {allSpecialties.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <select className="form-input form-select" value={sortBy} onChange={e => setSortBy(e.target.value)} style={{flex: "0 1 160px"}}>
              <option value="rating">Highest rated</option>
              <option value="jobs">Most experienced</option>
              <option value="turnaround">Fastest turnaround</option>
            </select>
            <button className={"btn btn-sm" + (showFavOnly ? "" : "")} onClick={() => setShowFavOnly(f => !f)} style={{background: showFavOnly ? "#FEF3C7" : "#F1F5F9", color: showFavOnly ? "#92400E" : "#64748B", border: "1px solid " + (showFavOnly ? "#FDE68A" : "#E2E8F0"), whiteSpace: "nowrap"}}>
              <Icon name="star" size={14} /> {showFavOnly ? "Showing favorites" : "Favorites only"}
            </button>
          </div>
        </div>

        <p style={{fontSize: 13, color: "#94A3B8", marginBottom: 16}}>{filtered.length} reporter{filtered.length !== 1 ? "s" : ""} found</p>

        {/* Reporter cards */}
        <div style={{display: "flex", flexDirection: "column", gap: 16}}>
          {filtered.map(r => (
            <div className="card" key={r.id} style={{padding: 0, overflow: "hidden", cursor: "pointer"}} onClick={() => navigate("/reporters/" + r.id)}>
              <div style={{display: "flex", gap: 20, padding: 24, flexWrap: "wrap"}}>
                {/* Avatar + core info */}
                <div style={{display: "flex", gap: 16, flex: "1 1 300px", minWidth: 0}}>
                  <div style={{width: 56, height: 56, borderRadius: "50%", background: "linear-gradient(135deg, #2563EB, #4F46E5)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 700, fontSize: 18, flexShrink: 0}}>{r.initials}</div>
                  <div style={{minWidth: 0}}>
                    <div style={{display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap"}}>
                      <span style={{fontSize: 16, fontWeight: 700, color: "var(--text-primary)"}}>{r.name}</span>
                      <span style={{fontSize: 12, color: "#64748B"}}>CSR #{r.csrNumber}</span>
                      {favorites.includes(r.id) && <span style={{fontSize: 11, fontWeight: 600, background: "#FEF3C7", color: "#92400E", padding: "2px 8px", borderRadius: 100}}>Favorite</span>}
                    </div>
                    <div style={{fontSize: 13, color: "#64748B", marginTop: 2}}><Icon name="mapPin" size={12} /> {r.city} · {r.counties.join(", ")}</div>
                    <div style={{display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap"}}>
                      {r.certifications.map(c => <span key={c} style={{fontSize: 10, fontWeight: 700, background: "#DBEAFE", color: "#1E40AF", padding: "2px 8px", borderRadius: 100}}>{c}</span>)}
                      {r.languages.filter(l => l !== "English").map(l => <span key={l} style={{fontSize: 10, fontWeight: 600, background: "#D1FAE5", color: "#065F46", padding: "2px 8px", borderRadius: 100}}>{l}</span>)}
                    </div>
                    <div style={{display: "flex", gap: 4, marginTop: 8, flexWrap: "wrap"}}>
                      {r.specialties.map(s => <span key={s} style={{fontSize: 10, color: "#64748B", background: "#F1F5F9", padding: "2px 8px", borderRadius: 100}}>{s}</span>)}
                    </div>
                  </div>
                </div>

                {/* Stats */}
                <div style={{display: "flex", gap: 24, alignItems: "center", flex: "0 0 auto", flexWrap: "wrap"}}>
                  <div style={{textAlign: "center"}}>
                    <div style={{fontSize: 20, fontWeight: 800, color: "#F59E0B", display: "flex", alignItems: "center", gap: 4, justifyContent: "center"}}>
                      <Icon name="star" size={16} /> {r.rating}
                    </div>
                    <div style={{fontSize: 11, color: "#94A3B8"}}>{r.reviewCount} reviews</div>
                  </div>
                  <div style={{textAlign: "center"}}>
                    <div style={{fontSize: 20, fontWeight: 800, color: "var(--text-primary)"}}>{r.stats.jobsCompleted}</div>
                    <div style={{fontSize: 11, color: "#94A3B8"}}>jobs</div>
                  </div>
                  <div style={{textAlign: "center"}}>
                    <div style={{fontSize: 20, fontWeight: 800, color: "#059669"}}>{r.stats.onTimeRate}%</div>
                    <div style={{fontSize: 11, color: "#94A3B8"}}>on time</div>
                  </div>
                  <div style={{textAlign: "center"}}>
                    <div style={{fontSize: 20, fontWeight: 800, color: "#2563EB"}}>{r.stats.avgTurnaround}</div>
                    <div style={{fontSize: 11, color: "#94A3B8"}}>avg turnaround</div>
                  </div>
                </div>

                {/* Actions */}
                <div style={{display: "flex", flexDirection: "column", gap: 8, justifyContent: "center", flex: "0 0 auto"}}>
                  <button className="btn btn-primary btn-sm" onClick={e => { e.stopPropagation(); navigate("/order"); }} style={{whiteSpace: "nowrap"}}>Book now</button>
                  <button className="btn btn-sm" onClick={e => { e.stopPropagation(); toggleFav(r.id); }} style={{whiteSpace: "nowrap", background: favorites.includes(r.id) ? "#FEF3C7" : undefined, color: favorites.includes(r.id) ? "#92400E" : undefined}}>
                    <Icon name="star" size={14} /> {favorites.includes(r.id) ? "Favorited" : "Favorite"}
                  </button>
                </div>
              </div>
            </div>
          ))}
          {filtered.length === 0 && (
            <div className="card" style={{padding: 48, textAlign: "center"}}>
              <Icon name="search" size={32} color="#CBD5E1" />
              <p style={{color: "#94A3B8", marginTop: 12}}>No reporters match your filters</p>
              <button className="btn btn-sm" onClick={() => { setSearch(""); setCounty("all"); setSpecialty("all"); setShowFavOnly(false); }} style={{marginTop: 8}}>Clear filters</button>
            </div>
          )}
        </div>
      </div>
      <ToastContainer toasts={toasts} onRemove={removeToast} />
    </div>
  );
}

function AppRouter() {
  const route = useRoute();
  const m = route.match(/^#\/order\/(.+)$/);
  if (m) return <OrderDetailPage orderId={m[1]} />;
  if (route.startsWith("#/request-copy")) return <RequestCopyPage />;
  if (route.startsWith("#/order")) return <OrderFlow />;
  if (route.startsWith("#/messages")) return <MessagingPage />;
  if (route.startsWith("#/dashboard")) return <BuyerDashboard />;
  if (route.startsWith("#/attorney-signup")) return <AttorneyOnboarding />;
  if (route.startsWith("#/reporter-signup")) return <ReporterOnboarding />;
  if (route.startsWith("#/kanban")) return <KanbanBoard />;
  const rp = route.match(/^#\/reporters\/(.+)$/);
  if (rp) return <ReporterProfile reporterId={rp[1]} />;
  if (route === "#/reporters" || route === "#/reporters/") return <ReporterDirectory />;
  if (route.startsWith("#/reporter")) return <ReporterDashboard />;
  if (route.startsWith("#/admin")) return <AdminDashboard />;
  if (route.startsWith("#/onboarding")) return <OnboardingFlow />;
  if (route.startsWith("#/settings")) return <SettingsPage />;
  if (route.startsWith("#/split-pay")) return <CostSplitPayPage />;
  if (route.startsWith("#/forgot-password")) return <ForgotPasswordPage />;
  if (route.startsWith("#/for-attorneys")) return <ForAttorneysPage />;
  if (route.startsWith("#/for-reporters")) return <ForReportersPage />;
  if (route.startsWith("#/contact")) return <ContactPage />;
  if (route.startsWith("#/faq")) return <FaqPage />;
  if (route.startsWith("#/about")) return <AboutPage />;
  if (route.startsWith("#/terms")) return <TermsPage />;
  if (route.startsWith("#/privacy")) return <PrivacyPage />;
  if (route.startsWith("#/trf")) return <TRFPage />;
  return <LandingPage />;
}

function App() {
  const [dark, setDark] = useState(false);
  const toggle = () => setDark(d => !d);
  useEffect(() => { document.documentElement.dataset.theme = dark ? "dark" : "light"; }, [dark]);
  return (
    <ThemeContext.Provider value={{ dark, toggle }}>
      <AppRouter />
    </ThemeContext.Provider>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
